    <!-- Configuration des couleurs sur-mesure (Holographic & Festif) -->

        tailwind.config = {
            theme: {

                    fontFamily: { sans: ['Outfit', 'sans-serif'] },

    <!-- Phosphor Icons pour les icônes (en defer pour ne pas bloquer le chargement) -->

    <style>
        /* Masquer la scrollbar pour un look d'app native */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Fallbacks de sécurité pour éviter la page blanche au chargement */
        html, body { background-color: #050212; color: #ffffff; }

        /* Animations fluides d'apparition (réservées aux changements de vues complets) */
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0); }
        }
        
        /* Lumières Vivantes (Aurora / Holographic Background) */
        .orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.6;
            animation: orbFloat 25s infinite cubic-bezier(0.4, 0, 0.2, 1) alternate;
            z-index: 0; pointer-events: none; mix-blend-mode: screen;
        }
        .orb-pink { background: #FF007A; width: 60vw; height: 60vw; top: -10%; left: -20%; animation-delay: 0s; }
        .orb-cyan { background: #00F0FF; width: 50vw; height: 50vw; bottom: -20%; right: -10%; animation-delay: -7s; }
        .orb-purple { background: #7000FF; width: 70vw; height: 70vw; top: 30%; left: 30%; animation-delay: -14s; opacity: 0.4; }
        .orb-gold { background: #FFD700; width: 40vw; height: 40vw; top: -20%; right: 10%; animation-delay: -2s; opacity: 0.2; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(8vw, -8vh) scale(1.2) rotate(10deg); }
            66% { transform: translate(-5vw, 5vh) scale(0.9) rotate(-10deg); }
            100% { transform: translate(0, 0) scale(1) rotate(0deg); }
        }
        
        /* HOLOGRAPHIC GLASSMORPHISM (Verre Premium) */
        .neo-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.3); border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* OPACIFICATION AU SCROLL (Pour le menu et les thèmes) */
        .glass-scrolled-panel {
            background: linear-gradient(135deg, rgba(5, 2, 18, 0.95) 0%, rgba(0, 0, 0, 0.98) 100%) !important;
            border-top: 1px solid rgba(0, 240, 255, 0.4) !important;
            border-left: 1px solid rgba(0, 240, 255, 0.2) !important;
            box-shadow: 0 30px 60px rgba(0,0,0,0.95), 0 0 20px rgba(0,240,255,0.15) !important;
        }
        .glass-scrolled-nav {
            background: linear-gradient(135deg, rgba(5, 2, 18, 0.95) 0%, rgba(0, 0, 0, 0.98) 100%) !important;
            border-top: 1px solid rgba(255, 0, 122, 0.5) !important;
            border-left: 1px solid rgba(255, 0, 122, 0.3) !important;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9) !important;
        }
        
        /* Cartes Interactives (Chansons) */
        .neo-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .neo-card:hover {
            transform: translateY(-6px) scale(1.02);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 240, 255, 0.15), 0 0 30px rgba(255, 0, 122, 0.15);
        }

        /* Boutons "Candy / Liquid" */
        .btn-liquid {
            background: linear-gradient(135deg, #FF007A 0%, #7000FF 100%); color: white;
            border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 4px 15px rgba(255, 0, 122, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
            position: relative; z-index: 1; overflow: hidden; transition: all 0.3s ease;
        }
        .btn-liquid::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #00F0FF 0%, #7000FF 100%); opacity: 0; z-index: -1; transition: opacity 0.4s ease;
        }
        .btn-liquid:hover::before { opacity: 1; }
        .btn-liquid:hover {
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px) scale(1.05); border-color: rgba(255, 255, 255, 0.8);
        }
        .btn-liquid:active { transform: translateY(2px) scale(0.95); }

        /* Textes lumineux / Typographie */
        .text-glow-white { text-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }
        .text-glow-pink { text-shadow: 0 0 20px rgba(255, 0, 122, 0.8); }
        .text-glow-cyan { text-shadow: 0 0 20px rgba(0, 240, 255, 0.8); }

        /* Animation de respiration pour les minuteurs / alertes */
        .pulse-magical { animation: pulseMagical 3s ease-in-out infinite alternate; }
        @keyframes pulseMagical {
            0% { box-shadow: 0 0 20px rgba(255,0,122,0.2); border-color: rgba(255,0,122,0.3); }
            100% { box-shadow: 0 0 40px rgba(0,240,255,0.4); border-color: rgba(0,240,255,0.6); }
        }

        /* Safe area padding pour smartphones */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        }

            songs: JSON.parse(JSON.stringify(initialSongs)), 
            view: 'login', 
            selectedTheme: 'Tous', 
            searchQuery: '',
            userVotes: {}, 
            totalUserVotes: 0, 
            loginError: '', 
            guestCode: 'FIESTA',
            eventStartTime: null, 
            currentPhase: 0,
            phase1Duration: 2 * 60 * 60 * 1000, 
            phase2Duration: 1 * 60 * 60 * 1000,
            sessionId: 'init',
            modal: null
        };

        // --- EXPOSITION DES FONCTIONS GLOBALES (Pour les onclick HTML) ---
        window.showModal = function(type, title, message, onConfirmCallback = null) {
            state.modal = { type, title, message, onConfirmCallback };
            render();
        }

        window.openExternalDisplay = function(type) {
            // Utilise l'URL absolue de base (sans les paramètres) pour éviter l'erreur 404 sur GitHub Pages
            const baseUrl = window.location.href.split('?')[0];
            const url = baseUrl + "?public=" + type;
            // Ouvre une nouvelle fenêtre pop-up dédiée à l'écran étendu
            window.open(url, "UniversalDJ_Display", "width=1280,height=720,menubar=no,toolbar=no,location=no,status=no");
            window.showModal('alert', 'Fenêtre Externe Ouverte', 'Une nouvelle fenêtre vient de s\'ouvrir.<br><br>Faites-la glisser sur votre 2ème écran (TV ou Vidéoprojecteur) puis appuyez sur <strong>F11</strong> pour la mettre en plein écran.');
        }

        window.closeModal = function() {
            state.modal = null;
            render();
        }

        window.confirmModal = function() {
            if (state.modal && state.modal.onConfirmCallback) {
                state.modal.onConfirmCallback();
            }
            window.closeModal();
        }

        // Fonction pour générer et télécharger le fichier M3U (Top 40)
        window.downloadM3U = function() {
            const top40Songs = [...state.songs].filter(s => (s.votes || 0) > 0).sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 40);
            if (top40Songs.length === 0) {
                window.showModal('alert', 'Aucun vote', 'Il n\'y a pas encore de votes pour générer la playlist.');
                return;
            }

            let m3uContent = "#EXTM3U\n";
            top40Songs.forEach((song) => {
                m3uContent += `#EXTINF:-1,${song.artist} - ${song.title}\n`;
                m3uContent += song.filepath ? `${song.filepath}\n` : `${song.artist} - ${song.title}.mp3\n`; 
            });

            const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            const date = new Date().toISOString().slice(0,10);
            a.download = `Universal_DJ_Top40_${date}.m3u`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        };

        // Fonction pour importer un fichier M3U8 et remplacer/ajouter un thème
        window.importM3U8 = function() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.m3u8,.m3u';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const themeName = prompt("Nom du thème pour cette playlist :", file.name.replace(/\.(m3u8?|M3U8?)$/, ''));
                if (!themeName) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const lines = ev.target.result.split(/\r?\n/);
                    const newSongs = [];
                    let extinf = null;
                    let nextId = Math.max(...state.songs.map(s => s.id)) + 1;
                    for (const line of lines) {
                        if (line.startsWith('#EXTINF:')) {
                            const m = line.match(/#EXTINF:\d+,(.*)/);
                            extinf = m ? m[1].trim() : null;
                        } else if (extinf && !line.startsWith('#') && line.trim()) {
                            let artist = 'Inconnu', title = extinf;
                            const parts = extinf.split(' - ');
                            if (parts.length >= 2) { artist = parts[0].trim(); title = parts.slice(1).join(' - ').trim(); }
                            // Dédoublonnage
                            const exists = state.songs.some(s => s.title.toLowerCase() === title.toLowerCase() && s.artist.toLowerCase() === artist.toLowerCase());
                            if (!exists) {
                                newSongs.push({ id: nextId++, title, artist, theme: themeName, filepath: line.trim(), votes: 0 });
                            }
                            extinf = null;
                        }
                    }
                    if (newSongs.length === 0) {
                        window.showModal('alert', 'Import vide', 'Aucun nouveau titre trouvé dans ce fichier (doublons exclus).');
                        return;
                    }
                    // Remove existing songs of this theme, then add new ones
                    const confirmReplace = state.songs.some(s => s.theme === themeName);
                    if (confirmReplace) {
                        window.showModal('confirm', 'Remplacer le thème ?', `Le thème "<strong>${themeName}</strong>" existe déjà (${state.songs.filter(s=>s.theme===themeName).length} titres).<br><br>Remplacer par les ${newSongs.length} nouveaux titres importés ?`, () => {
                            state.songs = state.songs.filter(s => s.theme !== themeName).concat(newSongs);
                            saveServerData();
                            render();
                            window.showModal('alert', 'Import réussi !', `<strong>${newSongs.length}</strong> titres importés dans le thème "<strong>${themeName}</strong>".`);
                        });
                    } else {
                        state.songs = state.songs.concat(newSongs);
                        saveServerData();
                        render();
                        window.showModal('alert', 'Import réussi !', `<strong>${newSongs.length}</strong> titres importés dans le nouveau thème "<strong>${themeName}</strong>".`);
                    }
                };
                reader.readAsText(file, 'utf-8');
            };
            input.click();
        };

        // Fonction pour ajouter un titre manuellement à un thème
        window.addSingleSong = function() {
            const themes = [...new Set(state.songs.map(s => s.theme))];
            const themeOptions = themes.map(t => `<option value="${t}">${t}</option>`).join('');
            
            state.modal = {
                type: 'custom',
                title: '🎵 Ajouter un titre',
                message: `
                    <div class="flex flex-col gap-4 text-left">
                        <div>
                            <label class="block text-sm text-white/60 mb-1 uppercase tracking-widest font-bold">Artiste *</label>
                            <input id="add-artist" type="text" placeholder="Ex: Daft Punk" class="w-full bg-black/60 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-magical-cyan focus:ring-2 focus:ring-magical-cyan/40 transition-all">
                        </div>
                        <div>
                            <label class="block text-sm text-white/60 mb-1 uppercase tracking-widest font-bold">Titre *</label>
                            <input id="add-title" type="text" placeholder="Ex: Get Lucky" class="w-full bg-black/60 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-magical-cyan focus:ring-2 focus:ring-magical-cyan/40 transition-all">
                        </div>
                        <div>
                            <label class="block text-sm text-white/60 mb-1 uppercase tracking-widest font-bold">Thème</label>
                            <div class="flex gap-2">
                                <select id="add-theme" class="flex-1 bg-black/60 border border-white/20 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-magical-cyan transition-all">
                                    ${themeOptions}
                                </select>
                                <button onclick="document.getElementById('add-theme-new').classList.toggle('hidden')" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-4 rounded-xl transition-all" title="Nouveau thème">+</button>
                            </div>
                            <input id="add-theme-new" type="text" placeholder="Ou créer un nouveau thème..." class="hidden w-full mt-2 bg-black/60 border border-magical-cyan/30 rounded-xl py-3 px-4 text-magical-cyan focus:outline-none focus:border-magical-cyan focus:ring-2 focus:ring-magical-cyan/40 transition-all">
                        </div>
                        <div>
                            <label class="block text-sm text-white/60 mb-1 uppercase tracking-widest font-bold">Chemin fichier <span class="text-white/30">(optionnel, pour export M3U8)</span></label>
                            <input id="add-filepath" type="text" placeholder="Ex: I:\\Musique\\Daft Punk - Get Lucky.mp3" class="w-full bg-black/60 border border-white/20 rounded-xl py-3 px-4 text-white/70 text-sm focus:outline-none focus:border-magical-cyan focus:ring-2 focus:ring-magical-cyan/40 transition-all font-mono">
                        </div>
                    </div>
                `,
                onConfirmCallback: () => {
                    const artist = document.getElementById('add-artist')?.value?.trim();
                    const title = document.getElementById('add-title')?.value?.trim();
                    const themeNew = document.getElementById('add-theme-new')?.value?.trim();
                    const themeSelect = document.getElementById('add-theme')?.value;
                    const filepath = document.getElementById('add-filepath')?.value?.trim() || '';
                    const theme = themeNew || themeSelect;
                    
                    if (!artist || !title) {
                        setTimeout(() => window.showModal('alert', 'Champs requis', 'L\'artiste et le titre sont obligatoires.'), 100);
                        return;
                    }
                    
                    const exists = state.songs.some(s => s.title.toLowerCase() === title.toLowerCase() && s.artist.toLowerCase() === artist.toLowerCase());
                    if (exists) {
                        setTimeout(() => window.showModal('alert', 'Doublon', `<strong>${artist} - ${title}</strong> existe déjà dans la playlist.`), 100);
                        return;
                    }
                    
                    const nextId = Math.max(...state.songs.map(s => s.id)) + 1;
                    state.songs.push({ id: nextId, title, artist, theme, filepath, votes: 0 });
                    saveServerData();
                    render();
                    setTimeout(() => window.showModal('alert', 'Titre ajouté !', `<strong>${artist} - ${title}</strong><br>ajouté au thème "<strong>${theme}</strong>".`), 100);
                }
            };
            render();
        };

        // Fonction pour exporter le code complet avec les playlists importées intégrées en dur
        window.exportCode = async function() {
            try {
                window.showModal('alert', 'Génération en cours...', 'Récupération du code source et intégration des playlists...');
                
                // Récupérer le code source actuel de la page
                const resp = await fetch(window.location.href.split('?')[0]);
                let html = await resp.text();
                
                // Construire le nouveau tableau initialSongs à partir de state.songs
                const songsJS = state.songs.map(s => {
                    const esc = (str) => (str||'').replace(/\\/g, '\\\\').replace(/"/g, '\\"');
                    return `[${s.id},"${esc(s.title)}","${esc(s.artist)}","${esc(s.theme)}","${esc(s.filepath || '')}"]`;
                }).join(',');
                
                // Remplacer la section initialSongs dans le HTML
                const regex = /const initialSongs = \[[\s\S]*?\]\.map\(s => \(\{[\s\S]*?\}\)\);/;
                const replacement = `const initialSongs = [\n            ${songsJS}\n        ].map(s => ({\n            id: s[0], \n            title: s[1], \n            artist: s[2], \n            theme: s[3], \n            filepath: s[4] || '',\n            votes: 0 \n        }));`;
                
                html = html.replace(regex, replacement);
                
                // Télécharger
                const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                
                const importedCount = state.songs.length - initialSongs.length;
                window.showModal('alert', 'Code exporté !', 
                    '<strong>' + state.songs.length + '</strong> titres intégrés en dur dans le fichier.' +
                    (importedCount > 0 ? '<br>dont <strong>' + importedCount + '</strong> titres importés via M3U8.' : '') +
                    '<br><br>Remplace le <strong>index.html</strong> sur GitHub par ce fichier pour rendre les changements permanents.');
            } catch(err) {
                window.showModal('alert', 'Erreur', 'Impossible de générer le code : ' + err.message);
            }
        };

        // Fonction pour réinitialiser la vue utilisateur et revenir en haut
        window.resetUserView = function() {
            state.searchQuery = '';
            state.selectedTheme = 'Tous';
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            render();
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        // --- INTEGRATION FIREBASE (CLOUD TEMPS RÉEL) ---
        let db, auth, appId, userId = null;
        let isCloudActive = false; // <-- Indicateur pour le tableau de bord
        let unsubscribePublic = null;
        let unsubscribePrivate = null;

        try {
            let firebaseConfig = null;
            let useCanvasAuth = false;

            if (typeof __firebase_config !== 'undefined' && __firebase_config && __firebase_config !== '{}') {
                firebaseConfig = JSON.parse(__firebase_config);
                appId = typeof __app_id !== 'undefined' ? __app_id : appId;
                useCanvasAuth = true;
            } 
            else if (MY_FIREBASE_CONFIG.apiKey !== "" && MY_FIREBASE_CONFIG.apiKey !== "COLLE_TA_CLE_API_ICI") {
                firebaseConfig = MY_FIREBASE_CONFIG;
                appId = MY_FIREBASE_CONFIG.appId || 'universal-dj-app';
            }

            if (firebaseConfig) {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isCloudActive = true;

                const initAuth = async () => {
                    try {
                        if (useCanvasAuth && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Erreur d'authentification Firebase:", error);
                        // On ne bloque pas l'écran de connexion pour l'instant.
                        // L'erreur sera signalée si l'utilisateur tente de voter.
                    }
                };
                initAuth();

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                    } else {
                        userId = null;
                    }
                    // TOUJOURS connecter aux données publiques
                    setupListeners();
                });
            } else {
                console.warn("Mode Hors-ligne (Local) activé. La base de données n'est pas configurée.");
            }
        } catch(error) {
            console.error("Erreur d'initialisation Firebase:", error);
        }

        function setupListeners() {
            // Listener PUBLIC (toujours actif)
            if (!unsubscribePublic) {
            const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'playlist', 'main');
            
            unsubscribePublic = onSnapshot(publicRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    state.sessionId = data.sessionId || 'init';
                    state.guestCode = data.guestCode || 'FIESTA';
                    state.eventStartTime = data.eventStartTime || null;
                    state.phase1Duration = data.phase1Duration || (2 * 60 * 60 * 1000);
                    state.phase2Duration = data.phase2Duration || (1 * 60 * 60 * 1000);

                    const cloudVotes = data.songVotes || {};
                    const oldTotal = state.songs.reduce((a,s) => a + (s.votes||0), 0);
                    state.songs.forEach(song => {
                        song.votes = cloudVotes[song.id] || 0;
                    });
                    const newTotal = state.songs.reduce((a,s) => a + (s.votes||0), 0);
                    if (newTotal > oldTotal && (state.view === 'qrcode' || state.view === 'monitor')) {
                        const fl = document.createElement('div');
                        fl.style.cssText = 'position:fixed;inset:0;z-index:200;pointer-events:none;background:radial-gradient(circle,rgba(0,240,255,.15),transparent 70%)';
                        document.body.appendChild(fl);
                        setTimeout(() => fl.remove(), 600);
                    }

                    checkPhase();
                    verifySessionAndLoadVotes();
                } else {
                    // Création de la DB si elle n'existe pas encore (Garantie Anti-crash)
                    setDoc(publicRef, {
                        sessionId: Date.now().toString(),
                        guestCode: state.guestCode || 'FIESTA',
                        eventStartTime: null,
                        phase1Duration: 2 * 60 * 60 * 1000,
                        phase2Duration: 1 * 60 * 60 * 1000,
                        songVotes: {}
                    }, { merge: true }).catch(e=>console.error("SetDoc error:", e));
                }
            }, (error) => console.error("Erreur lecture Cloud :", error));
            }

            // Listener PRIVÉ (seulement si authentifié)
            if (userId && !unsubscribePrivate) {
            const privateRef = doc(db, 'artifacts', appId, 'users', userId, 'userData', 'votes');
            
            unsubscribePrivate = onSnapshot(privateRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.sessionId === state.sessionId) {
                        state.userVotes = data.votes || {};
                        state.totalUserVotes = data.total || 0;
                    }
                }
                render();
            }, (error) => console.error("Erreur lecture locale :", error));
            }
        }
        // --- FIN INTEGRATION FIREBASE ---

        // Fonction magique : Vérifie si c'est une nouvelle soirée/tour et vide les crédits si besoin
        function verifySessionAndLoadVotes() {
            const localClientSession = localStorage.getItem('dj_client_session');
            
            // Si la session globale a changé, on vide les poches du téléphone
            if (localClientSession !== state.sessionId) {
                state.userVotes = {};
                state.totalUserVotes = 0;
                localStorage.setItem('dj_client_session', state.sessionId);
                localStorage.removeItem('dj_userVotes');
            } else {
                // Sinon on recharge les votes normaux
                const savedUserVotes = localStorage.getItem('dj_userVotes');
                if (savedUserVotes) {
                    state.userVotes = JSON.parse(savedUserVotes);
                    state.totalUserVotes = Object.values(state.userVotes).reduce((a, b) => a + b, 0);
                } else { 
                    state.userVotes = {}; 
                    state.totalUserVotes = 0; 
                }
            }
            render();
        }

        function loadServerData() {
            try {
                // Récupération de la session globale (soit de l'URL, soit du stockage)
                const urlParams = new URLSearchParams(window.location.search);
                const urlSession = urlParams.get('s');
                
                if (urlSession) {
                    state.sessionId = urlSession;
                    localStorage.setItem('dj_sessionId', urlSession);
                } else {
                    const savedSession = localStorage.getItem('dj_sessionId');
                    if (savedSession) state.sessionId = savedSession;
                    else state.sessionId = Date.now().toString();
                }

                // Vérification de la session pour vider ou charger les votes
                verifySessionAndLoadVotes();

                // Gestion du Mot de passe
                const urlCode = urlParams.get('code');
                if (urlCode) {
                    state.guestCode = urlCode.toUpperCase().trim();
                    localStorage.setItem('dj_guestCode', state.guestCode);
                } else {
                    const savedCode = localStorage.getItem('dj_guestCode');
                    if (savedCode && savedCode.trim() !== '') {
                        state.guestCode = savedCode.trim();
                    } else {
                        state.guestCode = 'FIESTA';
                    }
                }

                // Chargement des chansons
                const savedSongs = localStorage.getItem('dj_songs');
                if (savedSongs) {
                    const parsedSongs = JSON.parse(savedSongs);
                    if (Array.isArray(parsedSongs) && parsedSongs.length >= initialSongs.length) {
                        // Même taille ou plus (imports M3U8 ajoutés) → garder tel quel
                        state.songs = parsedSongs;
                    } else if (Array.isArray(parsedSongs)) {
                        // Le code a été mis à jour avec plus de titres → fusionner les votes + garder les imports
                        const oldVotes = {};
                        const importedSongs = [];
                        const initialIds = new Set(initialSongs.map(s => s.id));
                        parsedSongs.forEach(s => { 
                            if (s && s.id) oldVotes[s.id] = s.votes || 0;
                            // Conserver les titres importés par M3U8 (IDs absents de initialSongs)
                            if (s && s.id && !initialIds.has(s.id)) importedSongs.push(s);
                        });
                        state.songs = JSON.parse(JSON.stringify(initialSongs)).map(song => {
                            if (oldVotes[song.id]) song.votes = oldVotes[song.id];
                            return song;
                        }).concat(importedSongs);
                        saveServerData();
                    } else { state.songs = JSON.parse(JSON.stringify(initialSongs)); }
                } else { state.songs = JSON.parse(JSON.stringify(initialSongs)); }

                // Chargement Minuteur
                const savedStartTime = localStorage.getItem('dj_eventStartTime');
                if (savedStartTime && savedStartTime !== 'null') { state.eventStartTime = parseInt(savedStartTime, 10); } 
                else { state.eventStartTime = null; }

                const savedP1 = localStorage.getItem('dj_phase1');
                if (savedP1) state.phase1Duration = parseInt(savedP1, 10);
                const savedP2 = localStorage.getItem('dj_phase2');
                if (savedP2) state.phase2Duration = parseInt(savedP2, 10);
                
                // Détection de l'écran externe (HDMI/TV) pour contourner la page d'accueil
                const publicView = urlParams.get('public');
                if (publicView) {
                    state.view = publicView;
                }
            } catch (error) {
                console.error("Erreur de mémoire cache.", error);
                state.songs = JSON.parse(JSON.stringify(initialSongs)); 
                state.userVotes = {}; state.totalUserVotes = 0; state.eventStartTime = null;
            }
            if (!Array.isArray(state.songs)) state.songs = JSON.parse(JSON.stringify(initialSongs));
        }

        function saveServerData() {
            try {
                localStorage.setItem('dj_songs', JSON.stringify(state.songs));
                localStorage.setItem('dj_guestCode', state.guestCode);
                localStorage.setItem('dj_userVotes', JSON.stringify(state.userVotes));
                localStorage.setItem('dj_eventStartTime', state.eventStartTime || 'null');
                localStorage.setItem('dj_phase1', state.phase1Duration);
                localStorage.setItem('dj_phase2', state.phase2Duration);
                localStorage.setItem('dj_sessionId', state.sessionId);
            } catch (error) { console.error("Erreur de sauvegarde", error); }
        }

        function checkPhase() {
            if (!state.eventStartTime) {
                if (state.currentPhase !== 0) { state.currentPhase = 0; render(); }
                return;
            }
            const now = Date.now();
            const elapsed = now - state.eventStartTime;
            let newPhase = 0; let timeLeft = 0;
            const p1 = state.phase1Duration;
            const p2 = state.phase2Duration;

            if (elapsed < p1) { newPhase = 1; timeLeft = p1 - elapsed; } 
            else if (elapsed < p1 + p2) { newPhase = 2; timeLeft = (p1 + p2) - elapsed; } 
            else { newPhase = 3; timeLeft = 0; }

            // Vérification stricte du basculement automatique
            if (state.currentPhase !== newPhase) { 
                state.currentPhase = newPhase;
                
                // Redirection côté Écran Géant / Admin
                if ((newPhase === 2 || newPhase === 3) && state.view === 'qrcode') {
                    state.view = 'monitor';
                }
                
                // Pour l'utilisateur : forcer un scroll en haut pour bien voir le classement final !
                if (newPhase === 3 && state.view === 'user') {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
                
                render(); 
            }

            let globalTimeLeft = (p1 + p2) - elapsed;
            if (globalTimeLeft < 0) globalTimeLeft = 0;
            const gh = Math.floor(globalTimeLeft / 3600000).toString().padStart(2, '0');
            const gm = Math.floor((globalTimeLeft % 3600000) / 60000).toString().padStart(2, '0');
            const gs = Math.floor((globalTimeLeft % 60000) / 1000).toString().padStart(2, '0');
            const globalTimeStr = `${gh}:${gm}:${gs}`;

            document.querySelectorAll('.global-timer-display').forEach(el => { if (el.textContent !== globalTimeStr) el.textContent = globalTimeStr; });

            const h = Math.floor(timeLeft / 3600000).toString().padStart(2, '0');
            const m = Math.floor((timeLeft % 3600000) / 60000).toString().padStart(2, '0');
            const s = Math.floor((timeLeft % 60000) / 1000).toString().padStart(2, '0');
            const timeStr = `${h}:${m}:${s}`;

            document.querySelectorAll('.dynamic-timer-display').forEach(el => { if (el.textContent !== timeStr) el.textContent = timeStr; });
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'dj_songs' || e.key === 'dj_guestCode' || e.key === 'dj_eventStartTime' || e.key === 'dj_sessionId') {
                loadServerData(); checkPhase(); render(); 
            }
        });

        loadServerData(); setInterval(checkPhase, 1000);

        // ═══════════════════════════════════════════════════════════════
        // LECTURE DIRECTE via API REST (contourne le SDK comme pour les votes)
        // Lit les données publiques (minuteur, votes, session) toutes les 3 secondes
        // ═══════════════════════════════════════════════════════════════
        async function fetchPublicData() {
            if (!isCloudActive) return;
            try {
                const projectId = "laplaylistideale";
                const docPath = `artifacts/${appId}/public/data/playlist/main`;
                const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/${docPath}`;
                const resp = await fetch(url);
                if (!resp.ok) return;
                const doc = await resp.json();
                if (!doc.fields) return;
                
                const f = doc.fields;
                let changed = false;
                
                // Lecture du minuteur
                const newStartTime = (f.eventStartTime && f.eventStartTime.integerValue) ? parseInt(f.eventStartTime.integerValue) : null;
                if (newStartTime !== state.eventStartTime) { state.eventStartTime = newStartTime; changed = true; }
                
                // Lecture des durées
                if (f.phase1Duration && f.phase1Duration.integerValue) { const v = parseInt(f.phase1Duration.integerValue); if (v !== state.phase1Duration) { state.phase1Duration = v; changed = true; } }
                if (f.phase2Duration && f.phase2Duration.integerValue) { const v = parseInt(f.phase2Duration.integerValue); if (v !== state.phase2Duration) { state.phase2Duration = v; changed = true; } }
                
                // Lecture du code et de la session
                if (f.guestCode && f.guestCode.stringValue && f.guestCode.stringValue !== state.guestCode) { state.guestCode = f.guestCode.stringValue; changed = true; }
                if (f.sessionId && f.sessionId.stringValue && f.sessionId.stringValue !== state.sessionId) { state.sessionId = f.sessionId.stringValue; changed = true; }
                
                // Lecture des votes
                const oldTotal = state.songs.reduce((a,s) => a + (s.votes||0), 0);
                if (f.songVotes && f.songVotes.mapValue && f.songVotes.mapValue.fields) {
                    const sv = f.songVotes.mapValue.fields;
                    state.songs.forEach(song => {
                        const key = String(song.id);
                        const newVal = (sv[key] && sv[key].integerValue) ? parseInt(sv[key].integerValue) : 0;
                        if (newVal !== song.votes) { song.votes = newVal; changed = true; }
                    });
                }
                const newTotal = state.songs.reduce((a,s) => a + (s.votes||0), 0);
                
                // Flash sur l'écran géant quand un vote arrive
                if (newTotal > oldTotal && (state.view === 'qrcode' || state.view === 'monitor')) {
                    const fl = document.createElement('div');
                    fl.style.cssText = 'position:fixed;inset:0;z-index:200;pointer-events:none;background:radial-gradient(circle,rgba(0,240,255,.15),transparent 70%)';
                    document.body.appendChild(fl);
                    setTimeout(() => fl.remove(), 600);
                }
                
                // Calcul de la phase
                const oldPhase = state.currentPhase;
                checkPhase();
                if (state.currentPhase !== oldPhase) changed = true;
                
                // Re-afficher SEULEMENT si quelque chose a changé
                if (changed) {
                    saveServerData();
                    render();
                }
            } catch(e) { /* Silencieux */ }
        }
        
        // Première lecture immédiate + polling toutes les 3 secondes
        fetchPublicData();
        setInterval(fetchPublicData, 3000);

        window.checkGuestLogin = function(event) {
            event.preventDefault();

            const input = passEl.value.toUpperCase().trim();
            const correctCode = state.guestCode.toUpperCase().trim();
            
            // Si le code est correct OU si on est en mode "Hors ligne" on force l'accès
            if (input === correctCode || !isCloudActive) { 
                state.view = 'user'; 
                state.loginError = ''; 
                
                if (!isCloudActive) {
                    state.guestCode = input;
                    saveServerData();
                }
                
                // Nettoyage de l'URL avec protection Try-Catch
                try {
                    if (window.history && window.history.replaceState) {
                        const currentUrl = new URL(window.location.href);
                        // On évite les erreurs de sécurité dans les iframes de test
                        if (currentUrl.protocol !== 'blob:') {
                            currentUrl.searchParams.delete('code');
                            currentUrl.searchParams.delete('s');
                            const newPath = currentUrl.pathname + currentUrl.search;
                            window.history.replaceState({}, document.title, newPath);
                        }
                    }
                } catch (e) {
                    console.warn("Environnement restreint : nettoyage d'URL ignoré.");
                }
            } 
            else { 
                state.loginError = 'Code incorrect ou expiré !'; 
            }
            render();
        }

            else if (mode === '1H') { p1Min = 40; p2Min = 20; msg = "40 Minutes : QR Code géant.<br>- 20 Minutes : Top 40."; }
            else if (mode === '30M') { p1Min = 20; p2Min = 10; msg = "20 Minutes : QR Code géant.<br>- 10 Minutes : Top 40."; }
            else if (mode === '2M') { p1Min = 1; p2Min = 1; msg = "1 Minute : QR Code géant.<br>- 1 Minute : Top 40. (TEST)"; }
            
            window.showModal('confirm', `Démarrer le minuteur (${mode}) ?`, `${msg}<br>- Ensuite : Clôture des votes.`, () => {
                state.phase1Duration = p1Min * 60 * 1000;

        window.handleSearch = function(event) {

            const cards = document.querySelectorAll('.song-item-card');
            let visibleCount = 0;
            
            cards.forEach(card => {
                const searchData = card.getAttribute('data-search');
                if (searchData.includes(state.searchQuery)) {
                    card.style.display = 'flex';
                    visibleCount++;

        window.vote = async function(id) {
            if (state.currentPhase === 3) { window.showModal('alert', 'Votes clôturés', 'Les votes sont terminés pour cette session ! Regardez l\'écran géant.'); return; }
            if (state.totalUserVotes >= MAX_TOTAL_VOTES) return;
            const votesForSong = state.userVotes[id] || 0;
            if (votesForSong >= MAX_VOTES_PER_SONG) return;

            // Auth silencieuse (ne bloque jamais)

            // 1. Mise à jour Locale IMMÉDIATE
            state.userVotes[id] = votesForSong + 1; 
            state.totalUserVotes += 1;
            const songIndex = state.songs.findIndex(s => s.id === id);
            if (songIndex !== -1) { state.songs[songIndex].votes += 1; }
            
            saveServerData();
            render();

            // 2. Envoi DIRECT au Cloud via API REST (contourne le SDK Firebase)
            if (isCloudActive) {
                try {
                    const projectId = "laplaylistideale";
                    const docPath = `artifacts/${appId}/public/data/playlist/main`;
                    const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents:commit`;
                    
                    const resp = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            writes: [{
                                transform: {
                                    document: `projects/${projectId}/databases/(default)/documents/${docPath}`,
                                    fieldTransforms: [{
                                        fieldPath: `songVotes.\`${id}\``,
                                        increment: { integerValue: "1" }
                                    }]
                                }
                            }]
                        })
                    });

                    if (resp.ok) {
                        // ✅ Flash cyan = vote confirmé !
                        const fl = document.createElement('div');
                        fl.style.cssText = 'position:fixed;inset:0;z-index:200;pointer-events:none;background:radial-gradient(circle,rgba(0,240,255,.2),transparent 70%)';
                        document.body.appendChild(fl);
                        setTimeout(() => fl.remove(), 500);
                    } else {
                        console.warn("REST vote:", resp.status, await resp.text());
                    }
                } catch(e) {
                    console.warn("REST vote error:", e.message);
                }
            }

            // 3. Vérification de la limite finale
            if (state.totalUserVotes >= MAX_TOTAL_VOTES) {
                window.showModal('goodbye', 'Merci pour votre participation !', 'Vos 30 votes ont été enregistrés avec succès.<br><br>L\'application va se fermer pour laisser place à la musique !');
                setTimeout(() => {
                    window.location.href = "https://www.universal-dj.com/bar-a-vinyles-normandie/";
                }, 3000);
            }
        }

                                                btnClasses = isDisabled ? "bg-black/60 text-white/30 border border-white/5 cursor-not-allowed" : "btn-liquid border-transparent";
                                                btnText = "Voter"; iconColor = "";
                                            }

                                            return `
                                                <div class="song-item-card neo-card rounded-[1.25rem] sm:rounded-[1.5rem] p-3 sm:p-5 items-center justify-between" style="display: ${displayStyle};" data-search="${(song.title + ' ' + song.artist).toLowerCase().replace(/"/g, '&quot;')}">
                                                    <div class="flex items-center overflow-hidden flex-1 pr-1">
                                                        <div class="min-w-0 flex-1 pl-1 sm:pl-2">
                                                            <h3 class="font-bold text-white text-sm sm:text-lg truncate mb-0.5 tracking-wide">${song.title}</h3>
                                                            <p class="text-[10px] sm:text-sm font-light text-white/60 truncate tracking-wider">${song.artist}</p>
                                                        </div>
                                                    </div>
                                                    <button onclick="vote(${song.id})" ${isDisabled ? 'disabled' : ''} class="shrink-0 ml-2 sm:ml-4 flex items-center justify-center gap-1.5 sm:gap-2 px-3 sm:px-6 md:px-8 py-2 sm:py-3 md:py-3.5 rounded-xl sm:rounded-2xl text-[10px] sm:text-sm md:text-base font-black uppercase tracking-wide sm:tracking-widest transition-all ${btnClasses}">
                                                        <i class="ph-fill ph-heart ${iconColor} text-[10px] sm:text-xl"></i>
                                                        ${btnText}
                                                    </button>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                    <div id="empty-search-msg" class="text-center py-20 sm:py-32 neo-glass rounded-[2rem] sm:rounded-[3rem] mt-4" style="display: ${filteredSongs.some(s => (s.title + ' ' + s.artist).toLowerCase().includes(searchLower)) ? 'none' : 'block'};">
                                        <i class="ph-duotone ph-music-notes text-6xl sm:text-8xl text-magical-cyan/40 mb-4 sm:mb-6 inline-block drop-shadow-[0_0_20px_rgba(0,240,255,0.4)]"></i>
                                        <h3 class="text-xl sm:text-3xl font-black text-white mb-2 text-glow-white">Aucun titre trouvé</h3>
                                        <p class="text-sm sm:text-lg text-white/60 font-light">Essayez une autre recherche.</p>
                                    </div>
                                ` : `<div class="text-center py-20 sm:py-32 neo-glass rounded-[2rem] sm:rounded-[3rem] mt-4">
                                        <i class="ph-duotone ph-music-notes text-6xl sm:text-8xl text-magical-cyan/40 mb-4 sm:mb-6 inline-block drop-shadow-[0_0_20px_rgba(0,240,255,0.4)]"></i>
                                        <h3 class="text-xl sm:text-3xl font-black text-white mb-2 text-glow-white">Aucun titre trouvé</h3>
                                        <p class="text-sm sm:text-lg text-white/60 font-light">Essayez une autre catégorie.</p>
                                     </div>`}
                            </div>
                        `;
                    }
                } 
                else if (state.view === 'admin') {
                    const rankedSongs = [...state.songs].sort((a, b) => (b.votes || 0) - (a.votes || 0));
                    const totalVotes = state.songs.reduce((acc, song) => acc + (song.votes || 0), 0);

                    mainContent = `
                        <!-- RETRAIT DU ANIMATE-FADE-IN SUR LA VUE ADMIN POUR PLUS DE FLUIDITÉ -->
                        <div class="max-w-5xl mx-auto pb-24 pt-28 px-4 w-full">
                            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
                                <h2 class="text-4xl font-black text-white tracking-tight text-glow-white">Tableau de bord</h2>
                                <div class="neo-glass px-4 py-2 rounded-full flex items-center gap-2 border-white/20">
                                    <div class="w-2.5 h-2.5 rounded-full ${isCloudActive ? (userId ? 'bg-magical-cyan shadow-[0_0_8px_#00F0FF] animate-pulse' : 'bg-red-500 shadow-[0_0_8px_#EF4444] animate-pulse') : 'bg-orange-500 shadow-[0_0_8px_#F97316] animate-pulse'}"></div>
                                    <span class="text-xs font-bold ${isCloudActive ? (userId ? 'text-magical-cyan' : 'text-red-500') : 'text-orange-500'} uppercase tracking-widest">${isCloudActive ? (userId ? 'Cloud Actif' : 'Erreur Auth (Étape 3)') : 'Mode Local'}</span>
                                </div>
                            </div>
                            
                            <!-- FIREBASE CONFIG INSTRUCTION POUR LE MODE LOCAL -->
                            ${!isCloudActive ? `
                            <div class="neo-glass border border-orange-500/30 rounded-2xl p-4 mb-8">
                                <p class="text-orange-200 text-sm font-medium">⚠️ <strong>Attention :</strong> Vous êtes en Mode Local. Les votes des téléphones ne remonteront pas sur cet écran. Pour activer le Temps Réel sur votre site Github, ajoutez les clés de votre projet Firebase dans le code.</p>
                            </div>
                            ` : ''}

                            <div class="neo-glass border-t-magical-pink/50 rounded-[2.5rem] p-8 md:p-10 mb-8 relative overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                                <h3 class="text-3xl font-black text-white mb-2 flex items-center gap-4 tracking-tight relative z-10 text-glow-white">
                                    <i class="ph-fill ph-timer text-magical-pink text-4xl drop-shadow-[0_0_15px_rgba(255,0,122,0.8)]"></i> Minuteurs Automatiques
                                </h3>
                                <p class="text-white/70 text-lg mb-8 font-light relative z-10">Automatise l'écran géant : Affichage du QR Code, puis du Top 40, puis clôture définitive.</p>
                                <div class="flex flex-col md:flex-row gap-6 items-center justify-between bg-black/50 p-8 rounded-[2rem] border border-white/10 relative z-10 shadow-inner backdrop-blur-md">
                                    <div class="w-full md:w-auto">
                                        <span class="block text-sm text-white/50 font-bold mb-2 uppercase tracking-widest">Statut actuel :</span>
                                        ${state.currentPhase === 0 ? '<span class="text-white/60 font-black text-2xl">Non démarré</span>' :
                                          state.currentPhase === 1 ? '<span class="text-magical-cyan font-black text-2xl flex items-center gap-3 text-glow-cyan"><i class="ph-bold ph-spinner animate-spin"></i> Phase 1 : QR Code (<span class="dynamic-timer-display tabular-nums">--:--:--</span>)</span>' :
                                          state.currentPhase === 2 ? '<span class="text-magical-gold font-black text-2xl flex items-center gap-3 drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]"><i class="ph-bold ph-spinner animate-spin"></i> Phase 2 : Top 40 (<span class="dynamic-timer-display tabular-nums">--:--:--</span>)</span>' :
                                          '<span class="text-magical-pink font-black text-2xl flex items-center gap-3 text-glow-pink"><i class="ph-fill ph-check-circle"></i> Clôturé définitivement</span>'}
                                    </div>
                                    <div class="flex flex-col sm:flex-row w-full md:w-auto gap-3 mt-4 md:mt-0 flex-wrap justify-end">
                                        ${state.currentPhase === 0 ? 
                                            `<button onclick="startEventTimer('3H')" class="w-full sm:w-auto btn-liquid text-white font-black py-3 px-6 rounded-2xl flex items-center justify-center gap-2 text-sm md:text-base tracking-widest uppercase shadow-lg">
                                                <i class="ph-fill ph-play-circle text-xl"></i> 3H
                                            </button>
                                            <button onclick="startEventTimer('1H')" class="w-full sm:w-auto btn-liquid text-white font-black py-3 px-6 rounded-2xl flex items-center justify-center gap-2 text-sm md:text-base tracking-widest uppercase shadow-lg">
                                                <i class="ph-fill ph-play-circle text-xl"></i> 1H
                                            </button>
                                            <button onclick="startEventTimer('30M')" class="w-full sm:w-auto btn-liquid text-white font-black py-3 px-6 rounded-2xl flex items-center justify-center gap-2 text-sm md:text-base tracking-widest uppercase shadow-lg">
                                                <i class="ph-fill ph-play-circle text-xl"></i> 30 Min
                                            </button>
                                            <button onclick="startEventTimer('2M')" class="w-full sm:w-auto bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-3 px-6 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm md:text-base tracking-widest uppercase hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                                                <i class="ph-fill ph-flask text-xl text-magical-cyan"></i> Test 2M
                                            </button>` : 
                                            `<button onclick="stopEventTimer()" class="w-full md:w-auto bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-4 px-10 rounded-2xl transition-all flex items-center justify-center gap-3 text-xl tracking-widest uppercase hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                                                <i class="ph-bold ph-stop"></i> Arrêter / Annuler
                                            </button>`}
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                                <div class="neo-glass rounded-[2.5rem] p-8 relative overflow-hidden">
                                    <h3 class="text-2xl font-black text-white mb-2 flex items-center gap-3 tracking-tight text-glow-white">
                                        <i class="ph-fill ph-monitor-play text-magical-cyan text-3xl drop-shadow-[0_0_15px_rgba(0,240,255,0.8)]"></i> Écrans Publics
                                    </h3>
                                    <p class="text-white/70 text-base mb-8 font-light">Contrôle l'affichage sur vidéoprojecteur/TV.</p>
                                    <div class="flex flex-col gap-4">
                                        <div class="flex gap-4">
                                            <button onclick="forceEndAndShowMonitor()" class="flex-1 btn-liquid font-black px-4 py-5 rounded-2xl flex items-center justify-center gap-3 text-sm md:text-lg uppercase tracking-widest border-transparent shadow-[0_0_20px_rgba(255,0,122,0.4)] hover:shadow-[0_0_30px_rgba(255,0,122,0.6)]">
                                                <i class="ph-bold ph-monitor text-xl md:text-2xl"></i> Clôturer & Résultat
                                            </button>
                                            <button onclick="downloadM3U()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-4 py-5 rounded-2xl transition-colors flex items-center justify-center gap-2 hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]" title="Exporter M3U8 (Rekordbox)">
                                                <i class="ph-bold ph-download-simple text-xl md:text-2xl"></i>
                                            </button>
                                            <button onclick="importM3U8()" class="bg-white/10 hover:bg-magical-purple/20 border border-magical-purple/30 hover:border-magical-purple text-white font-bold px-4 py-5 rounded-2xl transition-colors flex items-center justify-center gap-2 hover:shadow-[0_0_15px_rgba(112,0,255,0.3)]" title="Importer une playlist M3U8">
                                                <i class="ph-bold ph-upload-simple text-xl md:text-2xl"></i>
                                            </button>
                                            <button onclick="exportCode()" class="bg-white/10 hover:bg-magical-gold/20 border border-magical-gold/30 hover:border-magical-gold text-white font-bold px-4 py-5 rounded-2xl transition-colors flex items-center justify-center gap-2 hover:shadow-[0_0_15px_rgba(255,215,0,0.3)]" title="Exporter le code pour GitHub">
                                                <i class="ph-bold ph-code text-xl md:text-2xl"></i>
                                            </button>
                                            <button onclick="addSingleSong()" class="bg-white/10 hover:bg-magical-cyan/20 border border-magical-cyan/30 hover:border-magical-cyan text-white font-bold px-4 py-5 rounded-2xl transition-colors flex items-center justify-center gap-2 hover:shadow-[0_0_15px_rgba(0,240,255,0.3)]" title="Ajouter un titre manuellement">
                                                <i class="ph-bold ph-music-note-plus text-xl md:text-2xl"></i>
                                            </button>
                                        </div>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <button onclick="openExternalDisplay('monitor')" class="w-full bg-white/5 hover:bg-white/10 border border-white/20 text-white font-bold px-4 py-4 rounded-2xl transition-colors flex items-center justify-center gap-2 text-[10px] sm:text-xs uppercase tracking-widest hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                                                <i class="ph-bold ph-screencast text-lg"></i> Fenêtre Classement
                                            </button>
                                            <button onclick="openExternalDisplay('qrcode')" class="w-full bg-white/5 hover:bg-white/10 border border-white/20 text-white font-bold px-4 py-4 rounded-2xl transition-colors flex items-center justify-center gap-2 text-[10px] sm:text-xs uppercase tracking-widest hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                                                <i class="ph-bold ph-screencast text-lg"></i> Fenêtre QR Code
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="neo-glass rounded-[2.5rem] p-8 flex flex-col justify-center">
                                    <h3 class="text-2xl font-black text-white mb-6 flex items-center gap-3 text-glow-white">
                                        <i class="ph-fill ph-lock-key text-white/50 text-3xl"></i> Mot de passe
                                    </h3>
                                    <div class="flex flex-col sm:flex-row gap-4 items-center">
                                        <input id="newGuestCode" type="text" value="${state.guestCode}" 
                                            class="w-full bg-black/60 border border-white/20 rounded-2xl py-5 px-6 text-white uppercase tracking-[0.2em] font-black text-2xl focus:outline-none focus:border-magical-cyan focus:ring-2 focus:ring-magical-cyan/40 transition-all text-center sm:text-left shadow-inner">
                                        <button onclick="updateGuestCode()" class="w-full sm:w-auto bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-8 py-5 rounded-2xl transition-colors whitespace-nowrap uppercase tracking-widest hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                                            Mettre à jour
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="neo-glass rounded-[2.5rem] p-8 mb-8 flex flex-col relative overflow-hidden">
                                <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 mb-6">
                                    <div class="relative z-10 text-left">
                                        <h2 class="text-4xl font-black text-white mb-2 tracking-tight text-glow-white">Gestion des Votes DJ</h2>
                                        <p class="text-white/70 font-medium text-lg">Contrôle absolu sur la soirée.</p>
                                    </div>
                                    <div class="bg-black/50 rounded-[1.5rem] px-10 py-5 border border-white/10 shadow-inner text-center shrink-0 w-full md:w-auto relative z-10">
                                        <span class="block text-sm text-white/50 uppercase tracking-[0.2em] mb-1 font-bold">Total votes</span>
                                        <span class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-magical-cyan to-magical-pink drop-shadow-md">${totalVotes}</span>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 relative z-10">
                                    <button onclick="allowReVote()" class="w-full bg-white/5 hover:bg-magical-cyan/20 text-magical-cyan hover:text-white border border-magical-cyan/30 hover:border-magical-cyan font-bold py-5 px-6 rounded-[1.5rem] transition-all flex justify-center items-center gap-3 uppercase tracking-widest hover:shadow-[0_0_20px_rgba(0,240,255,0.3)]">
                                        <i class="ph-bold ph-arrows-clockwise text-2xl"></i> Nouveau Tour
                                    </button>
                                    <button onclick="resetVotes()" class="w-full bg-white/5 hover:bg-red-500/20 text-red-400 hover:text-red-300 border border-red-500/30 hover:border-red-500/60 font-bold py-5 px-6 rounded-[1.5rem] transition-all flex justify-center items-center gap-3 uppercase tracking-widest hover:shadow-[0_0_20px_rgba(239,68,68,0.3)]">
                                        <i class="ph-bold ph-trash text-2xl"></i> Remise à zéro
                                    </button>
                                </div>
                                <p class="text-xs text-white/40 text-center mt-4 uppercase tracking-widest relative z-10">⚠️ Note: Les invités doivent flasher le nouveau QR Code pour récupérer 30 crédits.</p>
                            </div>

                            <!-- Classement des votes pour le DJ -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${rankedSongs.filter(s => s.votes > 0).map((song, index) => `
                                    <div class="neo-card rounded-[1.5rem] p-5 flex items-center justify-between">
                                        <div class="flex items-center gap-4 min-w-0 pr-4">
                                            <div class="w-12 h-12 shrink-0 rounded-xl bg-black/60 flex items-center justify-center font-black text-xl border border-white/10 ${index < 3 ? 'text-magical-gold shadow-[0_0_15px_rgba(255,215,0,0.3)]' : 'text-white/50'}">
                                                ${index + 1}
                                            </div>
                                            <div class="min-w-0">
                                                <h4 class="font-bold text-white text-lg tracking-wide truncate">${song.title}</h4>
                                                <p class="text-sm font-light text-white/60 truncate">${song.artist}</p>
                                            </div>
                                        </div>
                                        <div class="bg-black/50 px-5 py-2.5 rounded-xl border border-white/10 shrink-0">
                                            <span class="text-2xl font-black text-magical-cyan drop-shadow-[0_0_10px_rgba(0,240,255,0.5)]">${song.votes}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                htmlToRender = headerHTML + mainContent;
            }

            // --- RENDU DU POP-UP DESIGN ---
            let modalHTML = '';
            if (state.modal) {
                modalHTML = `
                    <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
                        <div class="neo-glass p-8 md:p-10 rounded-[2.5rem] w-full max-w-lg text-center border-t border-t-magical-pink/50 shadow-[0_20px_60px_rgba(0,0,0,0.8)]">
                            <h3 class="text-3xl font-black text-white mb-6 text-glow-white">${state.modal.title}</h3>
                            <div class="text-white/80 font-medium mb-8 text-lg leading-relaxed">${state.modal.message}</div>
                            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                                ${state.modal.type === 'goodbye' ? `
                                    <i class="ph-duotone ph-spinner-gap animate-spin text-5xl text-magical-cyan mx-auto mt-2 block drop-shadow-[0_0_15px_rgba(0,240,255,0.8)]"></i>
                                ` : state.modal.type === 'confirm' ? `
                                    <button onclick="window.closeModal()" class="flex-1 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-4 px-6 rounded-2xl transition-all uppercase tracking-widest text-sm hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">Annuler</button>
                                    <button onclick="window.confirmModal()" class="flex-1 btn-liquid text-white font-black py-4 px-6 rounded-2xl transition-all uppercase tracking-widest text-sm shadow-lg">Confirmer</button>
                                ` : state.modal.type === 'custom' ? `
                                    <button onclick="window.closeModal()" class="flex-1 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-4 px-6 rounded-2xl transition-all uppercase tracking-widest text-sm hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">Annuler</button>
                                    <button onclick="window.confirmModal()" class="flex-1 btn-liquid text-white font-black py-4 px-6 rounded-2xl transition-all uppercase tracking-widest text-sm shadow-lg">Ajouter</button>
                                ` : `
                                    <button onclick="window.closeModal()" class="w-full sm:w-2/3 mx-auto btn-liquid text-white font-black py-4 px-6 rounded-2xl transition-all uppercase tracking-widest text-sm shadow-lg">Compris</button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            root.innerHTML = htmlToRender + modalHTML;

            // Restaure la position de défilement des thèmes sur mobile
            if (state.view === 'user') {
                const container = document.getElementById('theme-scroll-container');
                if (container && state.themeScrollPos !== undefined) {
                    container.scrollLeft = state.themeScrollPos;
                }
            }
        }

        // Gestionnaire global pour opacifier le menu et la barre de recherche au scroll
        window.addEventListener('scroll', () => {
            const panel = document.getElementById('sticky-control-panel');
            const nav = document.getElementById('main-nav');
            
            if (window.scrollY > 20) {
                if (panel) panel.classList.add('glass-scrolled-panel');
                if (nav) nav.classList.add('glass-scrolled-nav');
            } else {
                if (panel) panel.classList.remove('glass-scrolled-panel');
                if (nav) nav.classList.remove('glass-scrolled-nav');
            }
        }, { passive: true });

        // Initialisation de l'affichage
        render();
    </script>
</body>
</html>
