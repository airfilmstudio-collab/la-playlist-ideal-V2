        html, body { background-color: #050212; color: #fff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* === ANIMATIONS === */
        .fade-in { animation: fadeIn .4s ease-out forwards; }
        @keyframes fadeIn { from { opacity:0; filter:blur(5px); } to { opacity:1; filter:blur(0); } }
        .pulse-magic { animation: pulseMagic 3s ease-in-out infinite alternate; }
        @keyframes pulseMagic {
            0% { box-shadow: 0 0 20px rgba(255,0,122,.2); border-color: rgba(255,0,122,.3); }
            100% { box-shadow: 0 0 40px rgba(0,240,255,.4); border-color: rgba(0,240,255,.6); }
        }

        /* === ORBES HOLOGRAPHIQUES === */
        .orb { position:absolute; border-radius:50%; filter:blur(100px); opacity:.6; animation:orbFloat 25s infinite cubic-bezier(.4,0,.2,1) alternate; z-index:0; pointer-events:none; mix-blend-mode:screen; }
        .orb-1 { background:#FF007A; width:60vw; height:60vw; top:-10%; left:-20%; }
        .orb-2 { background:#00F0FF; width:50vw; height:50vw; bottom:-20%; right:-10%; animation-delay:-7s; }
        .orb-3 { background:#7000FF; width:70vw; height:70vw; top:30%; left:30%; animation-delay:-14s; opacity:.4; }
        .orb-4 { background:#FFD700; width:40vw; height:40vw; top:-20%; right:10%; animation-delay:-2s; opacity:.2; }
        @keyframes orbFloat {
            0% { transform:translate(0,0) scale(1) rotate(0); }
            33% { transform:translate(8vw,-8vh) scale(1.2) rotate(10deg); }
            66% { transform:translate(-5vw,5vh) scale(.9) rotate(-10deg); }
            100% { transform:translate(0,0) scale(1) rotate(0); }
        }

        /* === GLASSMORPHISM === */
        .glass {
            background: linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.01));
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,.15);
            border-top-color: rgba(255,255,255,.3); border-left-color: rgba(255,255,255,.2);
            box-shadow: 0 12px 40px rgba(0,0,0,.4), inset 0 0 20px rgba(255,255,255,.05);
        }
        .glass-solid {
            background: linear-gradient(135deg, rgba(5,2,18,.95), rgba(0,0,0,.98)) !important;
            border-top-color: rgba(0,240,255,.4) !important; border-left-color: rgba(0,240,255,.2) !important;
            box-shadow: 0 30px 60px rgba(0,0,0,.95), 0 0 20px rgba(0,240,255,.15) !important;
        }
        .glass-nav-solid {
            background: linear-gradient(135deg, rgba(5,2,18,.95), rgba(0,0,0,.98)) !important;
            border-top-color: rgba(255,0,122,.5) !important; border-left-color: rgba(255,0,122,.3) !important;
            box-shadow: 0 15px 40px rgba(0,0,0,.9) !important;
        }

        /* === CARTES === */
        .card {
            background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.01));
            backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08);
            border-top-color: rgba(255,255,255,.15);
            transition: all .4s cubic-bezier(.175,.885,.32,1.275);
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
        }
        .card:hover {
            transform: translateY(-6px) scale(1.02);
            background: linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.02));
            border-color: rgba(255,255,255,.3);
            box-shadow: 0 20px 40px rgba(0,0,0,.4), 0 0 30px rgba(0,240,255,.15), 0 0 30px rgba(255,0,122,.15);
        }

        /* === BOUTONS === */
        .btn {
            background: linear-gradient(135deg, #FF007A, #7000FF); color:#fff;
            border: 1px solid rgba(255,255,255,.4);
            box-shadow: 0 4px 15px rgba(255,0,122,.4), inset 0 2px 4px rgba(255,255,255,.4);
            position:relative; z-index:1; overflow:hidden; transition: all .3s ease;
        }
        .btn::before {
            content:''; position:absolute; inset:0;
            background: linear-gradient(135deg, #00F0FF, #7000FF); opacity:0; z-index:-1; transition: opacity .4s;
        }
        .btn:hover::before { opacity:1; }
        .btn:hover { box-shadow: 0 8px 25px rgba(0,240,255,.6), inset 0 2px 4px rgba(255,255,255,.6); transform: translateY(-2px) scale(1.05); border-color: rgba(255,255,255,.8); }
        .btn:active { transform: translateY(2px) scale(.95); }

        /* === LUEURS TEXTE === */
        .glow { text-shadow: 0 0 20px rgba(255,255,255,.6); }
        .glow-pink { text-shadow: 0 0 20px rgba(255,0,122,.8); }
        .glow-cyan { text-shadow: 0 0 20px rgba(0,240,255,.8); }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {

const freshSongs = () => JSON.parse(JSON.stringify(SONGS));

let S = {
    songs: freshSongs(), view: 'login', theme: 'Tous', search: '',
    userVotes: {}, totalVotes: 0, error: '',
    guestCode: CONFIG.defaultGuestCode, adminCode: CONFIG.defaultAdminCode,
    startTime: null, phase: 0, p1: 7200000, p2: 3600000,
    session: 'init', closed: false, synced: false, modal: null, themeScroll: 0
};

const $ = id => document.getElementById(id);
const esc = s => (s||'').replace(/"/g, '&quot;').replace(/'/g, "\\'");
const ls = { get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } }, set: (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} }, rm: k => { try { localStorage.removeItem(k); } catch(e) {} } };

function save() {
    ls.set('dj_songs', JSON.stringify(S.songs));
    ls.set('dj_guestCode', S.guestCode); ls.set('dj_adminCode', S.adminCode);
    ls.set('dj_userVotes', JSON.stringify(S.userVotes));
    ls.set('dj_startTime', S.startTime || 'null');
    ls.set('dj_p1', S.p1); ls.set('dj_p2', S.p2);
    ls.set('dj_closed', S.closed); ls.set('dj_session', S.session);
}

function load() {
    try {
        const u = new URLSearchParams(location.search);
        const us = u.get('s'); if (us) { S.session = us; ls.set('dj_session', us); }
        else { S.session = ls.get('dj_session') || Date.now().toString(); }
        
        const uc = u.get('code'); if (uc) { S.guestCode = uc.toUpperCase().trim(); ls.set('dj_guestCode', S.guestCode); }
        else { S.guestCode = (ls.get('dj_guestCode') || CONFIG.defaultGuestCode).trim(); }
        S.adminCode = (ls.get('dj_adminCode') || CONFIG.defaultAdminCode).trim();
        
        const ss = ls.get('dj_songs');
        if (ss) { const p = JSON.parse(ss); if (Array.isArray(p) && p.length === SONGS.length) S.songs = p; else S.songs = freshSongs(); }
        
        const st = ls.get('dj_startTime'); S.startTime = (st && st !== 'null') ? parseInt(st) : null;
        const p1 = ls.get('dj_p1'); if (p1) S.p1 = parseInt(p1);
        const p2 = ls.get('dj_p2'); if (p2) S.p2 = parseInt(p2);
        S.closed = ls.get('dj_closed') === 'true';
        
        const pv = u.get('public'); if (pv) S.view = pv;
        syncSession();
    } catch(e) { console.error("Load error:", e); S.songs = freshSongs(); }
}

function syncSession() {
    const local = ls.get('dj_client_session');
    if (local !== S.session) {
        S.userVotes = {}; S.totalVotes = 0;
        ls.set('dj_client_session', S.session); ls.rm('dj_userVotes'); ls.rm('dj_songs');
        try { if (history.replaceState) { const u = new URL(location.href); u.searchParams.delete('s'); history.replaceState({}, '', u.pathname + u.search); } } catch(e) {}
    } else {
        const sv = ls.get('dj_userVotes');
        if (sv) { S.userVotes = JSON.parse(sv); S.totalVotes = Object.values(S.userVotes).reduce((a,b) => a+b, 0); }
    }
}

function qrUrl() {

    return `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(share)}&color=050212&bgcolor=FFFFFF`;

// ─── FIREBASE ───────────────────────────────────────────────────
// ARCHITECTURE : 
// 1. On initialise Firebase et Firestore
// 2. On ATTEND que l'auth se stabilise (succès OU échec) — c'est CRUCIAL
//    car le SDK Firestore met les écritures en file d'attente tant que l'auth n'est pas résolue
// 3. On démarre les listeners en lecture
// 4. Les écritures passent avec un timeout de sécurité

let authSettled = false; // Verrou : l'auth a-t-elle donné une réponse ?

async function initFirebase() {
    try {
        // Chargement dynamique de Firebase (ne bloque pas si le CDN est inaccessible)
        const [appMod, authMod, fsMod] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
        ]);
        initializeApp = appMod.initializeApp;
        getAuth = authMod.getAuth; signInAnonymously = authMod.signInAnonymously; onAuthStateChanged = authMod.onAuthStateChanged;
        getFirestore = fsMod.getFirestore; doc = fsMod.doc; setDoc = fsMod.setDoc; onSnapshot = fsMod.onSnapshot; increment = fsMod.increment;

        const app = initializeApp(CONFIG.firebase);
        auth = getAuth(app); db = getFirestore(app);
        appId = CONFIG.firebase.appId; cloud = true;

        // ÉTAPE CRITIQUE : attendre que l'auth se stabilise
        await new Promise(resolve => {
            const timeout = setTimeout(() => { 
                console.warn("Auth timeout — on continue sans auth");
                authSettled = true; resolve(); 
            }, 4000);
            
            signInAnonymously(auth).then(cred => {
                userId = cred.user.uid;
                clearTimeout(timeout); authSettled = true; resolve();
            }).catch(e => {
                console.warn("Auth échoué:", e.message, "— on continue sans");
                clearTimeout(timeout); authSettled = true; resolve();
            });
        });

        console.log("Auth settled. userId:", userId || "(aucun)");

        // Maintenant que l'auth est stabilisée, on démarre les listeners
        listenPublic();
        if (userId) listenPrivate();
        
        // Filet de sécurité pour le bouton de login
        setTimeout(() => { if (!S.synced) { S.synced = true; render(); } }, CONFIG.syncTimeout);
    } catch(e) { 
        console.error("Firebase init:", e);
        authSettled = true; // On débloque quand même
    }
}

function listenPublic() {
    if (unsub1) return;
    const pub = doc(db, 'artifacts', appId, 'public', 'data', 'playlist', 'main');
    unsub1 = onSnapshot(pub, snap => {
        S.synced = true;
        if (snap.exists()) {
            const d = snap.data();
            S.session = d.sessionId || 'init'; S.guestCode = d.guestCode || CONFIG.defaultGuestCode;
            S.adminCode = d.adminCode || CONFIG.defaultAdminCode; S.startTime = d.eventStartTime || null;
            S.p1 = d.phase1Duration || 7200000; S.p2 = d.phase2Duration || 3600000;
            S.closed = d.forceClosed || false;
            const cv = d.songVotes || {};
            const oldTotal = S.songs.reduce((a,s) => a + s.votes, 0);
            S.songs.forEach(s => { s.votes = cv[s.id] || 0; });
            const newTotal = S.songs.reduce((a,s) => a + s.votes, 0);
            // Flash quand un nouveau vote arrive sur l'écran géant
            if (newTotal > oldTotal && (S.view === 'qrcode' || S.view === 'monitor')) flashScreen();
            tick(); syncSession();
        } else {
            // Première utilisation : créer le document
            setDoc(pub, { sessionId: Date.now().toString(), guestCode: S.guestCode, adminCode: S.adminCode, eventStartTime: null, phase1Duration: S.p1, phase2Duration: S.p2, forceClosed: false, songVotes: {} }, { merge: true }).catch(e => console.error("Init doc:", e));
        }
    }, e => { console.error("Firestore read:", e); S.synced = true; render(); });
}

function listenPrivate() {
    if (!userId || unsub2) return;
    const priv = doc(db, 'artifacts', appId, 'users', userId, 'userData', 'votes');
    unsub2 = onSnapshot(priv, snap => {
        if (snap.exists()) { const d = snap.data(); if (d.sessionId === S.session) { S.userVotes = d.votes || {}; S.totalVotes = d.total || 0; } }
        render();
    }, e => console.error("Private read:", e));
}

// Écriture Firestore avec TIMEOUT — ne reste jamais bloqué
async function cloudWrite(ref, data) {
    if (!cloud || !db || !ref) return false;
    try {
        const write = setDoc(ref, data, { merge: true });
        const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout écriture (5s)')), 5000));
        await Promise.race([write, timeout]);
        return true;
    } catch(e) {
        console.error("cloudWrite:", e.message);
        return false;
    }
}

function pubRef() { if (!db) return null; return doc(db, 'artifacts', appId, 'public', 'data', 'playlist', 'main'); }
function privRef() { if (!db || !userId) return null; return doc(db, 'artifacts', appId, 'users', userId, 'userData', 'votes'); }

// ─── MINUTEUR ───────────────────────────────────────────────────
function tick() {
    if (S.closed) {
        if (S.phase !== 3) { S.phase = 3; autoNav(); render(); }
        updateTimerDisplays('00:00:00', '00:00:00'); return;
    }
    if (!S.startTime) { if (S.phase !== 0) { S.phase = 0; render(); } return; }
    
    const elapsed = Date.now() - S.startTime;
    let np = 0, tl = 0;
    if (elapsed < S.p1) { np = 1; tl = S.p1 - elapsed; }
    else if (elapsed < S.p1 + S.p2) { np = 2; tl = S.p1 + S.p2 - elapsed; }
    else { np = 3; tl = 0; }
    
    if (S.phase !== np) { S.phase = np; autoNav(); render(); }
    
    let gl = Math.max(0, S.p1 + S.p2 - elapsed);
    updateTimerDisplays(fmt(gl), fmt(tl));
}

function autoNav() {
    if ((S.phase === 2 || S.phase === 3) && S.view === 'qrcode') S.view = 'monitor';
    if (S.phase === 3 && S.view === 'user') scrollTo({ top:0, behavior:'smooth' });
}

function fmt(ms) {
    const h = Math.floor(ms/3600000).toString().padStart(2,'0');
    const m = Math.floor((ms%3600000)/60000).toString().padStart(2,'0');
    const s = Math.floor((ms%60000)/1000).toString().padStart(2,'0');
    return `${h}:${m}:${s}`;
}

function updateTimerDisplays(global, phase) {
    document.querySelectorAll('.gtimer').forEach(el => { if (el.textContent !== global) el.textContent = global; });
    document.querySelectorAll('.ptimer').forEach(el => { if (el.textContent !== phase) el.textContent = phase; });
}

    t.className = 'fixed bottom-20 left-4 right-4 z-[200] bg-red-500/90 text-white p-4 rounded-2xl text-center font-bold text-sm backdrop-blur-md';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 6000);
}

function flashScreen() {
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;inset:0;z-index:200;pointer-events:none;background:radial-gradient(circle,rgba(0,240,255,.15),transparent 70%);';

function cleanUrl() {
    try { const u = new URL(location.href); u.searchParams.delete('code'); u.searchParams.delete('s'); history.replaceState({}, '', u.pathname + u.search); } catch(e) {}
}

window.vote = async id => {
    if (S.closed || S.phase === 3) { modal('alert', 'Votes clôturés', 'Les votes sont terminés pour cette session !'); return; }
    if (S.totalVotes >= CONFIG.maxVotes) return;
    const cur = S.userVotes[id] || 0;
    if (cur >= CONFIG.maxPerSong) return;
    
    // 1. Vote LOCAL immédiat (l'invité voit le résultat tout de suite)
    S.userVotes[id] = cur + 1; S.totalVotes += 1;
    const idx = S.songs.findIndex(s => s.id === id);
    if (idx !== -1) S.songs[idx].votes += 1;
    save(); render();
    
    // 2. Envoi au CLOUD avec timeout et feedback
    if (cloud && db) {
        const ref = pubRef();
        if (ref) {
            const ok = await cloudWrite(ref, { songVotes: { [id]: increment(1) } });
            if (ok) {
                flashScreen(); // Flash cyan = vote reçu par Firebase !
            } else {
                showToast('⚠️ Vote local OK mais le cloud n\'a pas répondu.');
            }
        }
        // Votes privés (non bloquant)
        const pRef = privRef();
        if (pRef) cloudWrite(pRef, { sessionId: S.session, votes: S.userVotes, total: S.totalVotes });
    }
    
    if (S.totalVotes >= CONFIG.maxVotes) {
        modal('goodbye', 'Merci !', 'Vos 30 votes ont été enregistrés avec succès !');
        setTimeout(() => { location.href = CONFIG.redirectUrl; }, 3000);
    }
};

window.setCode = (type) => {
    const el = $(type === 'guest' ? 'newGuestCode' : 'newAdminCode');
    const v = el?.value.toUpperCase().trim(); if (!v) return;
    if (type === 'guest') S.guestCode = v; else S.adminCode = v;
    save(); if (cloud && db) cloudWrite(pubRef(), type === 'guest' ? { guestCode: v } : { adminCode: v });
    modal('alert', 'Mot de passe modifié', `Nouveau code : <strong class="text-4xl text-magical-cyan tracking-widest">${v}</strong>`);
};

window.startTimer = mode => {

        if (cloud && db) cloudWrite(pubRef(), { phase1Duration: S.p1, phase2Duration: S.p2, eventStartTime: S.startTime, forceClosed: false });

    });
};

window.stopTimer = () => {

function downloadM3U() {
    const top = [...S.songs].filter(s => s.votes > 0).sort((a,b) => b.votes - a.votes).slice(0, 40);
    if (!top.length) { modal('alert', 'Aucun vote', 'Pas de votes pour générer la playlist.'); return; }
    let c = "#EXTM3U\n"; top.forEach(s => { c += `#EXTINF:-1,${s.artist} - ${s.title}\n${s.artist} - ${s.title}.mp3\n`; });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([c], {type:'audio/x-mpegurl'}));
    a.download = `Universal_DJ_Top40_${new Date().toISOString().slice(0,10)}.m3u`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 100);
}

// ─── RENDU ──────────────────────────────────────────────────────
function render() {
    const root = $('app'); if (!root) return;
    const ext = new URLSearchParams(location.search).get('public') !== null;
    const closeBtn = ext ? 'window.close()' : "go('admin')";
    let html = '';

    // === VUE QR CODE ===
    if (S.view === 'qrcode' && S.phase !== 1) { html = viewQR(closeBtn); }
    // === VUE MONITEUR ===
    else if (S.view === 'monitor' || (S.view === 'qrcode' && S.phase === 1)) {
        html = S.phase === 1 ? viewQR(closeBtn) : viewMonitor(closeBtn);
    }
    // === VUE LOGIN ===
    else if (S.view === 'login' || S.view === 'adminLogin') { html = viewLogin(); }
    // === VUES PRINCIPALES ===
    else { html = viewNav() + (S.view === 'user' ? viewUser() : viewAdmin()); }

    // Modal
    if (S.modal) html += viewModal();
    root.innerHTML = html;

    // Restaurer scroll thèmes
    if (S.view === 'user') { const c = $('themeScroll'); if (c) c.scrollLeft = S.themeScroll; }
}

function viewQR(closeBtn) {

        <div class="flex flex-col items-center shrink-0 w-full">
            ${logoImg('h-12 sm:h-16 md:h-20 lg:h-24 object-contain drop-shadow-[0_0_30px_rgba(255,0,122,.6)] cursor-pointer hover:scale-105 transition-transform mb-2 md:mb-4', `onclick="go('admin')"`)}
            <h1 class="text-[7vw] md:text-6xl lg:text-7xl xl:text-[5.5rem] font-black text-transparent bg-clip-text bg-gradient-to-r from-magical-cyan via-white to-magical-pink uppercase tracking-widest whitespace-nowrap leading-none pb-1">VOTRE PLAYLIST IDÉALE</h1>

            <h2 class="text-lg md:text-2xl lg:text-4xl font-light text-white/90 glow">Flashez pour <span class="font-bold text-transparent bg-clip-text bg-gradient-to-r from-magical-gold to-magical-pink">voter !</span></h2>
            <div class="glass p-3 md:p-5 lg:p-6 rounded-[2rem] lg:rounded-[3rem] shadow-[0_20px_60px_rgba(0,0,0,.6)] border-2 border-white/20 flex flex-col items-center shrink min-h-0">
                <div class="bg-white p-2 md:p-3 lg:p-4 rounded-xl lg:rounded-2xl mb-4 aspect-square flex items-center justify-center"><img src="${qrUrl()}" alt="QR" class="w-full h-full max-h-[45vh] max-w-[45vh] lg:max-h-[50vh] lg:max-w-[50vh] object-contain rounded-lg"></div>

}

function viewMonitor(closeBtn) {
    const top = [...S.songs].filter(s => s.votes > 0).sort((a,b) => b.votes - a.votes).slice(0,40);
    const title = S.phase === 3 ? 'LE CLASSEMENT FINAL' : 'VOTRE PLAYLIST IDÉALE';
    return `<div class="h-screen w-screen flex flex-col p-4 md:p-6 relative overflow-hidden">
        <button onclick="${closeBtn}" class="absolute top-4 right-4 text-white/0 hover:text-white/50 z-50 p-3 rounded-full hover:bg-white/10"><i class="ph-bold ph-x text-2xl"></i></button>
        <div class="relative z-10 flex justify-between items-center mb-6 px-2">
            <div class="flex items-center gap-6">${logoImg('h-14 md:h-20 object-contain drop-shadow-[0_0_30px_rgba(255,0,122,.6)] cursor-pointer hover:scale-105 transition-transform', `onclick="go('admin')"`)}
                <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-magical-cyan via-white to-magical-pink uppercase tracking-widest glow">${title}</h1>

            <div class="flex items-center gap-6">
                ${S.phase===2 ? `<div class="glass px-6 py-2.5 rounded-2xl flex items-center gap-4"><span class="text-magical-cyan font-bold text-sm uppercase tracking-widest">Fin des votes :</span><span class="text-white font-black text-3xl tabular-nums ptimer glow-cyan">--:--:--</span></div>` : S.phase===3 ? `<div class="btn px-8 py-3 rounded-2xl pulse-magic"><span class="text-white font-black text-2xl uppercase tracking-widest glow">Les votes sont clôturés</span></div>` : ''}
                ${S.phase===2 ? `<div class="hidden md:flex items-center gap-4 glass p-2 pr-8 rounded-3xl border border-white/20"><div class="bg-white p-2 rounded-2xl"><img src="${qrUrl()}" alt="QR" class="w-16 h-16 rounded-xl object-contain"></div><div><span class="text-lg font-bold text-white glow">Flashez pour voter !</span><br><span class="text-sm text-magical-cyan">Code : <strong class="text-white tracking-widest glow">${S.guestCode}</strong></span></div></div>` : ''}

}

function rankCard(song, i, fullH=false) {
    const t3 = i < 3;
    let rs = 'text-white/40 text-xl font-bold', bs = 'card bg-white/[.01]';
    if (i===0) { rs='text-magical-gold text-2xl sm:text-3xl glow'; bs='card bg-gradient-to-r from-magical-gold/20 to-transparent border-magical-gold/40 shadow-[0_0_20px_rgba(255,215,0,.3)]'; }
    else if (i===1) { rs='text-slate-300 text-xl sm:text-2xl glow'; bs='card bg-gradient-to-r from-white/10 to-transparent border-white/30'; }
    else if (i===2) { rs='text-orange-500 text-xl sm:text-2xl glow'; bs='card bg-gradient-to-r from-orange-500/20 to-transparent border-orange-500/30'; }
    return `<div class="flex items-center ${bs} rounded-2xl px-3 sm:px-4 overflow-hidden ${fullH?'h-full':'py-3'}"><div class="w-8 sm:w-10 text-center font-black shrink-0 ${rs}">${i+1}</div><div class="flex-1 min-w-0 px-2 sm:px-4 border-l border-white/10 ml-2 sm:ml-3 py-1"><div class="text-sm sm:text-base md:text-lg font-bold text-white truncate leading-tight">${song.title}</div><div class="text-[10px] sm:text-xs font-light text-white/70 truncate mt-0.5 tracking-wide">${song.artist}</div></div><div class="shrink-0 bg-black/50 rounded-xl px-3 sm:px-4 py-1 sm:py-1.5 border border-white/10 shadow-inner"><span class="text-lg sm:text-xl md:text-2xl font-black ${t3?'text-white':'text-magical-cyan'}">${song.votes}</span></div></div>`;
}

function emptyState(done) {
    return `<div class="flex flex-col items-center justify-center h-full text-center"><i class="ph-duotone ${done?'ph-check-circle text-magical-cyan':'ph-disc text-magical-pink/50'} text-9xl mb-6"></i><h3 class="text-4xl font-bold text-white mb-3 glow">${done?'Playlist Terminée':'En attente des votes...'}</h3><p class="text-2xl text-white/60 font-light">${done?'Aucun vote enregistré.':'La playlist se prépare !'}</p></div>`;
}

            <div class="flex flex-col md:flex-row gap-6 items-center justify-between bg-black/50 p-8 rounded-[2rem] border border-white/10 shadow-inner backdrop-blur-md">
                <div><span class="block text-sm text-white/50 font-bold mb-2 uppercase tracking-widest">Statut :</span>
                    ${phase===0?'<span class="text-white/60 font-black text-2xl">Non démarré</span>':phase===1?'<span class="text-magical-cyan font-black text-2xl flex items-center gap-3 glow-cyan"><i class="ph-bold ph-spinner animate-spin"></i> Phase 1 : QR Code (<span class="ptimer tabular-nums">--:--:--</span>)</span>':phase===2?'<span class="text-magical-gold font-black text-2xl flex items-center gap-3"><i class="ph-bold ph-spinner animate-spin"></i> Phase 2 : Top 40 (<span class="ptimer tabular-nums">--:--:--</span>)</span>':'<span class="text-magical-pink font-black text-2xl flex items-center gap-3 glow-pink"><i class="ph-fill ph-check-circle"></i> Clôturé</span>'}
                </div>
                <div class="flex flex-col sm:flex-row gap-3 flex-wrap justify-end">
                    ${phase===0?Object.keys(TIMERS).map(k=>`<button onclick="startTimer('${k}')" class="${k==='2M'?'bg-white/10 hover:bg-white/20 border border-white/20 text-white':'btn text-white'} font-black py-3 px-6 rounded-2xl flex items-center justify-center gap-2 text-sm uppercase tracking-widest"><i class="ph-fill ${k==='2M'?'ph-flask text-magical-cyan':'ph-play-circle'} text-xl"></i> ${k}</button>`).join(''):`<button onclick="stopTimer()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-4 px-10 rounded-2xl flex items-center justify-center gap-3 text-xl uppercase tracking-widest"><i class="ph-bold ph-stop"></i> Arrêter</button>`}
                </div>
            </div>
        </div>

        <!-- ÉCRANS + CODES -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="glass rounded-[2.5rem] p-8">
                <h3 class="text-2xl font-black text-white mb-2 flex items-center gap-3 glow"><i class="ph-fill ph-monitor-play text-magical-cyan text-3xl"></i> Écrans Publics</h3>
                <p class="text-white/70 mb-8 font-light">Vidéoprojecteur / TV</p>
                <div class="flex flex-col gap-4">
                    <div class="flex gap-4"><button onclick="forceEnd()" class="flex-1 btn font-black px-4 py-5 rounded-2xl flex items-center justify-center gap-3 text-sm md:text-lg uppercase tracking-widest"><i class="ph-bold ph-monitor text-xl md:text-2xl"></i> Clôturer & Résultat</button><button onclick="downloadM3U()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-4 py-5 rounded-2xl"><i class="ph-bold ph-download-simple text-xl md:text-2xl"></i></button></div>
                    <div class="grid grid-cols-2 gap-4"><button onclick="openDisplay('monitor')" class="bg-white/5 hover:bg-white/10 border border-white/20 text-white font-bold px-4 py-4 rounded-2xl text-[10px] sm:text-xs uppercase tracking-widest flex items-center justify-center gap-2"><i class="ph-bold ph-screencast text-lg"></i> Classement</button><button onclick="openDisplay('qrcode')" class="bg-white/5 hover:bg-white/10 border border-white/20 text-white font-bold px-4 py-4 rounded-2xl text-[10px] sm:text-xs uppercase tracking-widest flex items-center justify-center gap-2"><i class="ph-bold ph-screencast text-lg"></i> QR Code</button></div>
                </div>
            </div>
            <div class="glass rounded-[2.5rem] p-8 flex flex-col justify-center">
                <h3 class="text-2xl font-black text-white mb-6 flex items-center gap-3 glow"><i class="ph-fill ph-lock-key text-white/50 text-3xl"></i> Mots de passe</h3>
                <div class="flex flex-col gap-6">
                    <div><span class="block text-xs text-white/50 uppercase tracking-[.2em] mb-2 font-bold">Code Invité</span><div class="flex flex-col sm:flex-row gap-4"><input id="newGuestCode" type="text" value="${S.guestCode}" class="w-full bg-black/60 border border-white/20 rounded-2xl py-4 px-6 text-white uppercase tracking-[.2em] font-black text-xl focus:outline-none focus:border-magical-cyan shadow-inner text-center sm:text-left"><button onclick="setCode('guest')" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-6 py-4 rounded-2xl uppercase tracking-widest text-sm whitespace-nowrap">Modifier</button></div></div>
                    <div class="border-t border-white/10 pt-6"><span class="block text-xs text-white/50 uppercase tracking-[.2em] mb-2 font-bold">Code DJ</span><div class="flex flex-col sm:flex-row gap-4"><input id="newAdminCode" type="text" value="${S.adminCode}" class="w-full bg-black/60 border border-white/20 rounded-2xl py-4 px-6 text-white uppercase tracking-[.2em] font-black text-xl focus:outline-none focus:border-magical-purple shadow-inner text-center sm:text-left"><button onclick="setCode('admin')" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold px-6 py-4 rounded-2xl uppercase tracking-widest text-sm whitespace-nowrap">Modifier</button></div></div>
                </div>
            </div>
        </div>

        <!-- GESTION VOTES -->
        <div class="glass rounded-[2.5rem] p-8 mb-8">
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6 mb-6">
                <div><h2 class="text-4xl font-black text-white mb-2 glow">Gestion des Votes</h2><p class="text-white/70 text-lg">Contrôle absolu.</p></div>
                <div class="bg-black/50 rounded-[1.5rem] px-10 py-5 border border-white/10 shadow-inner text-center w-full md:w-auto"><span class="block text-sm text-white/50 uppercase tracking-[.2em] mb-1 font-bold">Total</span><span class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-magical-cyan to-magical-pink">${total}</span></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="newRound()" class="bg-white/5 hover:bg-magical-cyan/20 text-magical-cyan hover:text-white border border-magical-cyan/30 hover:border-magical-cyan font-bold py-5 px-6 rounded-[1.5rem] transition-all flex justify-center items-center gap-3 uppercase tracking-widest"><i class="ph-bold ph-arrows-clockwise text-2xl"></i> Nouveau Tour</button>
                <button onclick="resetAll()" class="bg-white/5 hover:bg-red-500/20 text-red-400 hover:text-red-300 border border-red-500/30 hover:border-red-500/60 font-bold py-5 px-6 rounded-[1.5rem] transition-all flex justify-center items-center gap-3 uppercase tracking-widest"><i class="ph-bold ph-trash text-2xl"></i> Remise à zéro</button>
            </div>
            <p class="text-xs text-white/40 text-center mt-4 uppercase tracking-widest">⚠️ Les invités doivent re-scanner le QR Code après un nouveau tour.</p>
        </div>

        <!-- CLASSEMENT DJ -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${ranked.filter(s=>s.votes>0).map((s,i)=>`<div class="card rounded-[1.5rem] p-5 flex items-center justify-between"><div class="flex items-center gap-4 min-w-0 pr-4"><div class="w-12 h-12 shrink-0 rounded-xl bg-black/60 flex items-center justify-center font-black text-xl border border-white/10 ${i<3?'text-magical-gold shadow-[0_0_15px_rgba(255,215,0,.3)]':'text-white/50'}">${i+1}</div><div class="min-w-0"><h4 class="font-bold text-white text-lg truncate">${s.title}</h4><p class="text-sm font-light text-white/60 truncate">${s.artist}</p></div></div><div class="bg-black/50 px-5 py-2.5 rounded-xl border border-white/10 shrink-0"><span class="text-2xl font-black text-magical-cyan">${s.votes}</span></div></div>`).join('')}</div>
    </div>`;
}

function viewModal() {
    const m = S.modal;
    return `<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md fade-in">
        <div class="glass p-8 md:p-10 rounded-[2.5rem] w-full max-w-lg text-center border-t border-magical-pink/50 shadow-[0_20px_60px_rgba(0,0,0,.8)]">
            <h3 class="text-3xl font-black text-white mb-6 glow">${m.title}</h3>
            <p class="text-white/80 mb-8 text-lg leading-relaxed">${m.msg}</p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                ${m.type==='goodbye'?'<i class="ph-duotone ph-spinner-gap animate-spin text-5xl text-magical-cyan mx-auto mt-2 block"></i>':m.type==='confirm'?`<button onclick="closeModal()" class="flex-1 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-4 px-6 rounded-2xl uppercase tracking-widest text-sm">Annuler</button><button onclick="confirmModal()" class="flex-1 btn text-white font-black py-4 px-6 rounded-2xl uppercase tracking-widest text-sm">Confirmer</button>`:`<button onclick="closeModal()" class="w-full sm:w-2/3 mx-auto btn text-white font-black py-4 px-6 rounded-2xl uppercase tracking-widest text-sm">Compris</button>`}
            </div>
        </div>
    </div>`;
}

// ─── SCROLL HANDLER ─────────────────────────────────────────────
addEventListener('scroll', () => {
    const p = $('stickyPanel'), n = $('mainNav');
    if (scrollY > 20) { p?.classList.add('glass-solid'); n?.classList.add('glass-nav-solid'); }
    else { p?.classList.remove('glass-solid'); n?.classList.remove('glass-nav-solid'); }
}, { passive: true });

// ─── AUTO-REFRESH (ANTI-FANTÔMES) ──────────────────────────────
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') ls.set('dj_sleep', Date.now().toString());
    else { const t = ls.get('dj_sleep'); if (t && Date.now() - parseInt(t) > CONFIG.sleepTimeout) location.reload(); }
});

addEventListener('storage', e => { if (e.key?.startsWith('dj_')) { load(); tick(); render(); } });

// ─── DÉMARRAGE ──────────────────────────────────────────────────
load();
render(); // Affichage immédiat (login)
await initFirebase(); // Attendre que Firebase soit prêt
setInterval(tick, 1000);
render(); // Re-afficher avec les données cloud

</script>
</body>
</html>
