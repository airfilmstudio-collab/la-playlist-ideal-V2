    <style>
        /* Masquer la scrollbar pour un look d'app native */

        /* Fallbacks de sécurité */
        html, body { background-color: #050505; color: #FDFCF0; }

        /* Effet de grain photographique (Luxe / Print) */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 100; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Animations fluides et lentes */
        .animate-fade-in { animation: fadeIn 0.8s cubic-bezier(0.2, 0, 0, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Lumière ambiante très subtile */
        .ambient-light {
            position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15;
            z-index: 0; pointer-events: none; mix-blend-mode: screen;
        }
        .light-gold { background: #D4AF37; width: 50vw; height: 50vw; top: -20%; left: -10%; }
        .light-white { background: #FFFFFF; width: 40vw; height: 40vw; bottom: -10%; right: -10%; opacity: 0.05;}

        /* Verre dépoli Premium (Finesse extrême) */
        .glass-panel {
            background: rgba(26, 26, 26, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .glass-header {
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Cartes Minimalistes */
        .luxury-card {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.5s cubic-bezier(0.2, 0, 0, 1);
        }
        .luxury-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(255, 255, 255, 0.02);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Boutons Éditoriaux */
        .btn-luxury {
            background: #D4AF37; color: #050505;
            border: 1px solid #D4AF37;
            position: relative; overflow: hidden; transition: all 0.4s ease;
            text-transform: uppercase; letter-spacing: 0.15em; font-weight: 500;
        }
        .btn-luxury:hover {
            background: #FDFCF0; border-color: #FDFCF0; color: #050505;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .btn-outline {
            background: transparent; color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.5);
            transition: all 0.4s ease;
        }
        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1); border-color: #D4AF37;
        }

        /* Textes & Lignes */
        .text-glow-gold { text-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent); }

        /* Animation pulsation élégante */
        .pulse-luxury { animation: pulseLuxury 4s ease-in-out infinite alternate; }
        @keyframes pulseLuxury {
            0% { box-shadow: 0 0 10px rgba(212,175,55,0.1); border-color: rgba(212,175,55,0.2); }
            100% { box-shadow: 0 0 25px rgba(212,175,55,0.3); border-color: rgba(212,175,55,0.5); }
        }

        /* Inputs minimalistes */
        .input-minimal {
            background: transparent;
            border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0; transition: border-color 0.3s ease;
        }
        .input-minimal:focus {
            border-bottom-color: #D4AF37; outline: none; box-shadow: none;
        }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
        }
    </style>

            id: s[0], title: s[1], artist: s[2], theme: s[3], votes: 0 
        }));

        // --- ÉTAT GLOBAL ---
        let state = {
            songs: JSON.parse(JSON.stringify(initialSongs)), 
            view: 'login', selectedTheme: 'Tous', searchQuery: '', userVotes: {}, totalUserVotes: 0, 
            loginError: '', guestCode: 'FIESTA', eventStartTime: null, currentPhase: 0,

            const baseUrl = window.location.href.split('?')[0];
            const url = baseUrl + "?public=" + type;
            window.open(url, "UniversalDJ_Display", "width=1280,height=720,menubar=no,toolbar=no,location=no,status=no");

        window.downloadM3U = function() {
            const top40Songs = [...state.songs].filter(s => (s.votes || 0) > 0).sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 40);
            if (top40Songs.length === 0) { window.showModal('alert', 'Information', 'Aucun vote enregistré pour le moment.'); return; }

            let m3uContent = "#EXTM3U\n";
            top40Songs.forEach((song) => {
                m3uContent += `#EXTINF:-1,${song.artist} - ${song.title}\n${song.artist} - ${song.title}.mp3\n`; 
            });

            const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.style.display = 'none'; a.href = url;
            a.download = `Universal_DJ_Top40_${new Date().toISOString().slice(0,10)}.m3u`;
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);

        window.resetUserView = function() {
            state.searchQuery = ''; state.selectedTheme = 'Tous';

            if (searchInput) searchInput.value = '';

        // --- INTEGRATION FIREBASE ---
        let db, auth, appId, userId = null;
        let isCloudActive = false;
        let unsubscribePublic = null;
        let unsubscribePrivate = null;

        try {
            let firebaseConfig = null;
            let useCanvasAuth = false;

            if (typeof __firebase_config !== 'undefined' && __firebase_config && __firebase_config !== '{}') {
                firebaseConfig = JSON.parse(__firebase_config);
                appId = typeof __app_id !== 'undefined' ? __app_id : appId;
                useCanvasAuth = true;
            } 
            else if (MY_FIREBASE_CONFIG.apiKey !== "" && MY_FIREBASE_CONFIG.apiKey !== "COLLE_TA_CLE_API_ICI") {
                firebaseConfig = MY_FIREBASE_CONFIG;
                appId = MY_FIREBASE_CONFIG.appId || 'universal-dj-app';
            }

            if (firebaseConfig) {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isCloudActive = true;

                const initAuth = async () => {
                    try {
                        if (useCanvasAuth && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) { console.error("Firebase Auth error:", error); }
                };
                initAuth();

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid; setupListeners();
                    } else {
                        userId = null;
                        if (unsubscribePublic) unsubscribePublic();
                        if (unsubscribePrivate) unsubscribePrivate();
                    }
                });
            }
        } catch(error) { console.error("Firebase Init error:", error); }

        function setupListeners() {
            const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'playlist', 'main');
            unsubscribePublic = onSnapshot(publicRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.sessionId = data.sessionId || 'init';
                    state.guestCode = data.guestCode || 'FIESTA';
                    state.eventStartTime = data.eventStartTime || null;
                    state.phase1Duration = data.phase1Duration || (2 * 60 * 60 * 1000);
                    state.phase2Duration = data.phase2Duration || (1 * 60 * 60 * 1000);

                    const cloudVotes = data.songVotes || {};
                    state.songs.forEach(song => { song.votes = cloudVotes[song.id] || 0; });

                    checkPhase(); verifySessionAndLoadVotes();
                } else {
                    setDoc(publicRef, {
                        sessionId: Date.now().toString(), guestCode: state.guestCode, eventStartTime: null,
                        phase1Duration: state.phase1Duration, phase2Duration: state.phase2Duration, songVotes: {}
                    }, { merge: true }).catch(e=>console.error("SetDoc error:", e));
                }
            }, (error) => console.error("Cloud read error :", error));

            const privateRef = doc(db, 'artifacts', appId, 'users', userId, 'userData', 'votes');
            unsubscribePrivate = onSnapshot(privateRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.sessionId === state.sessionId) {
                        state.userVotes = data.votes || {};
                        state.totalUserVotes = data.total || 0;
                    }
                }
                render();
            }, (error) => console.error("Local read error :", error));
        }

        function verifySessionAndLoadVotes() {
            const localClientSession = localStorage.getItem('dj_client_session');
            if (localClientSession !== state.sessionId) {
                state.userVotes = {}; state.totalUserVotes = 0;
                localStorage.setItem('dj_client_session', state.sessionId);
                localStorage.removeItem('dj_userVotes');
            } else {
                const savedUserVotes = localStorage.getItem('dj_userVotes');
                if (savedUserVotes) {
                    state.userVotes = JSON.parse(savedUserVotes);
                    state.totalUserVotes = Object.values(state.userVotes).reduce((a, b) => a + b, 0);
                } else { state.userVotes = {}; state.totalUserVotes = 0; }
            }
            render();
        }

        function loadServerData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const urlSession = urlParams.get('s');
                if (urlSession) { state.sessionId = urlSession; localStorage.setItem('dj_sessionId', urlSession); } 
                else {
                    const savedSession = localStorage.getItem('dj_sessionId');
                    state.sessionId = savedSession ? savedSession : Date.now().toString();
                }

                verifySessionAndLoadVotes();

                const urlCode = urlParams.get('code');
                if (urlCode) { state.guestCode = urlCode.toUpperCase().trim(); localStorage.setItem('dj_guestCode', state.guestCode); } 
                else {
                    const savedCode = localStorage.getItem('dj_guestCode');
                    state.guestCode = (savedCode && savedCode.trim() !== '') ? savedCode.trim() : 'FIESTA';
                }

                const savedSongs = localStorage.getItem('dj_songs');
                if (savedSongs) {
                    const parsedSongs = JSON.parse(savedSongs);
                    if (Array.isArray(parsedSongs) && parsedSongs.length === initialSongs.length) { state.songs = parsedSongs; } 
                    else if (Array.isArray(parsedSongs)) {
                        const oldVotes = {}; parsedSongs.forEach(s => { if (s && s.id) oldVotes[s.id] = s.votes || 0; });
                        state.songs = JSON.parse(JSON.stringify(initialSongs)).map(song => { if (oldVotes[song.id]) song.votes = oldVotes[song.id]; return song; });
                        saveServerData();
                    } else { state.songs = JSON.parse(JSON.stringify(initialSongs)); }
                } else { state.songs = JSON.parse(JSON.stringify(initialSongs)); }

                const savedStartTime = localStorage.getItem('dj_eventStartTime');
                state.eventStartTime = (savedStartTime && savedStartTime !== 'null') ? parseInt(savedStartTime, 10) : null;

                const savedP1 = localStorage.getItem('dj_phase1'); if (savedP1) state.phase1Duration = parseInt(savedP1, 10);
                const savedP2 = localStorage.getItem('dj_phase2'); if (savedP2) state.phase2Duration = parseInt(savedP2, 10);
                
                const publicView = urlParams.get('public'); if (publicView) state.view = publicView;
            } catch (error) { state.songs = JSON.parse(JSON.stringify(initialSongs)); state.userVotes = {}; state.totalUserVotes = 0; state.eventStartTime = null; }
        }

        function saveServerData() {
            try {
                localStorage.setItem('dj_songs', JSON.stringify(state.songs));
                localStorage.setItem('dj_guestCode', state.guestCode);
                localStorage.setItem('dj_userVotes', JSON.stringify(state.userVotes));
                localStorage.setItem('dj_eventStartTime', state.eventStartTime || 'null');
                localStorage.setItem('dj_phase1', state.phase1Duration);
                localStorage.setItem('dj_phase2', state.phase2Duration);
                localStorage.setItem('dj_sessionId', state.sessionId);
            } catch (error) { console.error("Save error", error); }
        }

        function checkPhase() {
            if (!state.eventStartTime) {
                if (state.currentPhase !== 0) { state.currentPhase = 0; render(); }
                return;
            }
            const now = Date.now();
            const elapsed = now - state.eventStartTime;
            let newPhase = 0; let timeLeft = 0;
            const p1 = state.phase1Duration; const p2 = state.phase2Duration;

            if (elapsed < p1) { newPhase = 1; timeLeft = p1 - elapsed; } 
            else if (elapsed < p1 + p2) { newPhase = 2; timeLeft = (p1 + p2) - elapsed; } 
            else { newPhase = 3; timeLeft = 0; }

            if (state.currentPhase !== newPhase) { 
                state.currentPhase = newPhase;
                if ((newPhase === 2 || newPhase === 3) && state.view === 'qrcode') state.view = 'monitor';
                if (newPhase === 3 && state.view === 'user') window.scrollTo({ top: 0, behavior: 'smooth' });
                render(); 
            }

            let globalTimeLeft = Math.max(0, (p1 + p2) - elapsed);
            const fmt = (t) => `${Math.floor(t / 3600000).toString().padStart(2, '0')}:${Math.floor((t % 3600000) / 60000).toString().padStart(2, '0')}:${Math.floor((t % 60000) / 1000).toString().padStart(2, '0')}`;
            
            const globalTimeStr = fmt(globalTimeLeft);
            document.querySelectorAll('.global-timer-display').forEach(el => { if (el.textContent !== globalTimeStr) el.textContent = globalTimeStr; });

            const timeStr = fmt(timeLeft);
            document.querySelectorAll('.dynamic-timer-display').forEach(el => { if (el.textContent !== timeStr) el.textContent = timeStr; });
        }

        window.addEventListener('storage', function(e) {
            if (['dj_songs', 'dj_guestCode', 'dj_eventStartTime', 'dj_sessionId'].includes(e.key)) { loadServerData(); checkPhase(); render(); }
        });

        loadServerData(); setInterval(checkPhase, 1000);

        window.checkGuestLogin = function(event) {
            event.preventDefault();

            const input = passEl.value.toUpperCase().trim();
            const correctCode = state.guestCode.toUpperCase().trim();
            
            if (input === correctCode || !isCloudActive) { 
                state.view = 'user'; state.loginError = ''; 
                if (!isCloudActive) { state.guestCode = input; saveServerData(); }
                try {
                    if (window.history && window.history.replaceState) {
                        const currentUrl = new URL(window.location.href);
                        if (currentUrl.protocol !== 'blob:') {
                            currentUrl.searchParams.delete('code'); currentUrl.searchParams.delete('s');
                            window.history.replaceState({}, document.title, currentUrl.pathname + currentUrl.search);
                        }
                    }
                } catch (e) { }
            } else { state.loginError = 'Code incorrect.'; }
            render();
        }

        window.startEventTimer = function(mode) {
            let p1Min, p2Min, msg;
            if (mode === '3H') { p1Min = 120; p2Min = 60; msg = "2 Heures : Affichage QR Code<br>1 Heure : Affichage Top 40"; }
            else if (mode === '1H') { p1Min = 40; p2Min = 20; msg = "40 Minutes : QR Code<br>20 Minutes : Top 40"; }
            else if (mode === '30M') { p1Min = 20; p2Min = 10; msg = "20 Minutes : QR Code<br>10 Minutes : Top 40"; }
            else if (mode === '2M') { p1Min = 1; p2Min = 1; msg = "1 Minute : QR Code<br>1 Minute : Top 40 (Démo)"; }
            
            window.showModal('confirm', `Lancer le set (${mode})`, `${msg}`, () => {
                state.phase1Duration = p1Min * 60 * 1000; state.phase2Duration = p2Min * 60 * 1000;
                state.eventStartTime = Date.now(); saveServerData(); 
                
                if (isCloudActive && db && userId) {
                    const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'playlist', 'main');
                    setDoc(publicRef, { phase1Duration: state.phase1Duration, phase2Duration: state.phase2Duration, eventStartTime: state.eventStartTime }, { merge: true }).catch(e=>console.error(e));

                state.view = 'monitor'; checkPhase(); render();

        window.vote = async function(id) {
            if (state.currentPhase === 3) { window.showModal('alert', 'Sélection clôturée', 'Les jeux sont faits.'); return; }
            if (state.totalUserVotes >= MAX_TOTAL_VOTES) return;
            const votesForSong = state.userVotes[id] || 0;
            if (votesForSong >= MAX_VOTES_PER_SONG) return;

            if (isCloudActive && db && !userId) {
                try {
                    const userCredential = await signInAnonymously(auth); userId = userCredential.user.uid;
                    await new Promise(r => setTimeout(r, 600)); if (!userId) throw new Error("Annulé");
                } catch (error) { return; }
            }

            state.userVotes[id] = votesForSong + 1; state.totalUserVotes += 1;
            const songIndex = state.songs.findIndex(s => s.id === id);
            if (songIndex !== -1) state.songs[songIndex].votes += 1;
            saveServerData(); render();

            if (isCloudActive && db && userId) {
                const privateRef = doc(db, 'artifacts', appId, 'users', userId, 'userData', 'votes');
                setDoc(privateRef, { sessionId: state.sessionId, votes: state.userVotes, total: state.totalUserVotes }).catch(e=>console.error(e));
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'playlist', 'main');
                setDoc(publicRef, { songVotes: { [id]: increment(1) } }, { merge: true }).catch(err => console.error("PublicRef error:", err));
            }

            if (state.totalUserVotes >= MAX_TOTAL_VOTES) {
                window.showModal('goodbye', 'Excellents choix.', 'Vos préférences ont été transmises au DJ. Laissez-vous porter par l\'atmosphère.');

            }

                                    <div class="text-center">
                                        <p class="text-sm text-luxury-light/60 mb-2 font-medium uppercase tracking-[0.3em]">Code d'accès</p>
                                        <p class="text-5xl md:text-7xl font-light text-luxury-gold tracking-[0.2em] font-serif">${state.guestCode}</p>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                } else {
                    const top40Songs = [...state.songs].filter(s => (s.votes || 0) > 0).sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 40);
                    htmlToRender = `
                        <div class="h-screen w-screen flex flex-col p-8 relative animate-fade-in bg-luxury-dark">
                            <button onclick="${isExternalDisplay ? 'window.close()' : "goTo('admin')"}" class="absolute top-8 right-8 text-luxury-light/50 hover:text-luxury-light transition-colors z-50 p-3 rounded-full hover:bg-white/5 border border-transparent hover:border-luxury-border">
                                <i class="ph-light ph-x text-2xl"></i>
                            </button>
                            <div class="flex justify-between items-center mb-8 pb-6 border-b border-luxury-border">
                                <div class="flex flex-col">
                                    <h1 class="text-4xl md:text-5xl font-serif font-light text-luxury-light uppercase tracking-[0.2em]">
                                        ${state.currentPhase === 3 ? 'Sélection Éditoriale' : 'Tendances Actuelles'}
                                    </h1>
                                </div>
                                <div class="flex items-center gap-8">
                                    ${state.currentPhase === 2 ? `
                                        <div class="border border-luxury-gold/40 px-6 py-2 rounded-sm flex items-center gap-4">
                                            <span class="text-luxury-light/60 text-xs uppercase tracking-[0.2em]">Clôture</span>
                                            <span class="text-luxury-gold font-light text-2xl tabular-nums dynamic-timer-display">--:--:--</span>
                                        </div>
                                        <div class="flex items-center gap-6 pl-8 border-l border-luxury-border">
                                            <div class="bg-luxury-light p-1.5 rounded-sm"><img src="${getQRCodeUrl()}" alt="QR" class="w-12 h-12"></div>
                                            <div class="text-right">
                                                <div class="text-sm text-luxury-light/60 uppercase tracking-widest">Rejoignez-nous</div>
                                                <div class="text-xl font-serif text-luxury-gold tracking-[0.2em]">${state.guestCode}</div>
                                            </div>
                                        </div>
                                    ` : state.currentPhase === 3 ? `
                                        <div class="px-8 py-3 border border-luxury-gold/50 rounded-sm">
                                            <span class="text-luxury-gold font-light text-xl uppercase tracking-[0.2em]">La sélection est finalisée</span>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                            <div class="flex-1 w-full overflow-hidden">
                                ${top40Songs.length > 0 ? `
                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-4 h-full" style="grid-template-rows: repeat(10, minmax(0, 1fr)); grid-auto-flow: column;">
                                        ${top40Songs.map((song, index) => {
                                            const isTop3 = index < 3;
                                            let rStyle = "text-luxury-light/40 font-light"; 
                                            let bStyle = "border-b border-luxury-border hover:bg-white/[0.02]";
                                            if (index === 0) { rStyle = "text-luxury-gold font-medium"; }
                                            else if (index === 1) { rStyle = "text-gray-300 font-medium"; }
                                            else if (index === 2) { rStyle = "text-amber-700/80 font-medium"; }
                                            return `
                                                <div class="flex items-center ${bStyle} px-2 h-full transition-colors">
                                                    <div class="w-8 text-lg ${rStyle}">${String(index + 1).padStart(2, '0')}</div>
                                                    <div class="flex-1 min-w-0 px-4 py-1">
                                                        <div class="text-sm md:text-base font-medium text-luxury-light truncate tracking-wide">${song.title}</div>
                                                        <div class="text-xs font-light text-luxury-light/50 truncate tracking-wider uppercase mt-0.5">${song.artist}</div>
                                                    </div>
                                                    <div class="text-base font-light ${isTop3 ? 'text-luxury-gold' : 'text-luxury-light/70'}">${song.votes}</div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                ` : `
                                    <div class="flex flex-col items-center justify-center h-full text-center">
                                        <i class="ph-thin ph-vinyl-record text-7xl text-luxury-gold/30 mb-6 animate-spin-slow"></i>
                                        <h3 class="text-2xl font-serif text-luxury-light mb-2 uppercase tracking-[0.2em]">Atmosphère en préparation</h3>
                                    </div>
                                `}
                            </div>
                        </div>
                    `;
                }
            } 
            // --- VUES DE CONNEXION ---
            else if (state.view === 'login' || state.view === 'adminLogin') {
                const isAdmin = state.view === 'adminLogin';
                const urlParams = new URLSearchParams(window.location.search);
                const codeFromUrl = urlParams.get('code');
                let autoFillCode = (!isAdmin && codeFromUrl) ? codeFromUrl.toUpperCase() : "";

                htmlToRender = `
                    <div class="min-h-screen flex flex-col items-center justify-center p-6 relative animate-fade-in z-10">
                        <div class="glass-panel w-full max-w-md rounded-sm p-10 md:p-14 text-center">
                            <h1 class="text-4xl font-serif font-light text-luxury-light mb-2 tracking-[0.1em] uppercase">${isAdmin ? 'Espace Réservé' : 'Accès Privilège'}</h1>
                            <div class="divider w-24 mx-auto mb-8"></div>
                            
                            <form onsubmit="${isAdmin ? 'checkAdminLogin(event)' : 'checkGuestLogin(event)'}" class="space-y-8">
                                <div>
                                    <input type="text" id="${isAdmin ? 'adminPass' : 'guestPass'}" placeholder="${isAdmin ? 'Code Éditeur' : 'Sésame'}" 
                                        value="${autoFillCode}"
                                        class="w-full input-minimal py-3 px-2 text-center text-xl text-luxury-light uppercase tracking-[0.3em] font-light placeholder:text-luxury-light/20">
                                </div>
                                ${state.loginError ? `<p class="text-red-400/80 text-sm tracking-widest uppercase">${state.loginError}</p>` : ''}
                                <button type="submit" class="w-full btn-luxury py-4">
                                    ${isAdmin ? 'Accéder' : 'Découvrir'}
                                </button>
                            </form>
                            
                            <div class="mt-12 pt-8 border-t border-luxury-border">
                                <button onclick="goTo('${isAdmin ? 'login' : 'adminLogin'}')" class="text-xs text-luxury-light/40 hover:text-luxury-gold transition-colors uppercase tracking-[0.2em]">
                                    ${isAdmin ? 'Espace Invité' : 'Espace Éditeur'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } 
            // --- VUES UTILISATEUR & ADMIN ---
            else {
                const isScrolled = window.scrollY > 20;
                const headerStyle = isScrolled ? 'glass-header' : 'bg-transparent';
                const isTimerActive = state.eventStartTime !== null && state.currentPhase > 0 && state.currentPhase < 3;

                const headerHTML = `
                    <div class="fixed top-0 left-0 w-full z-50 transition-all duration-500 ${headerStyle}">
                        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                            <div class="flex items-center gap-6">
                                <button onclick="${state.view === 'user' ? "resetUserView()" : "goTo('admin')"}" class="text-xl font-serif uppercase tracking-[0.2em] hover:text-luxury-gold transition-colors">
                                    Universal DJ
                                </button>
                            </div>
                            <div class="flex items-center gap-6">
                                ${isTimerActive ? `
                                    <div class="hidden md:flex items-center gap-3 text-sm tracking-widest text-luxury-gold/80 uppercase">
                                        Temps <span class="global-timer-display tabular-nums">--:--:--</span>
                                    </div>
                                ` : ''}
                                <button onclick="goTo('login')" class="text-xs uppercase tracking-[0.2em] text-luxury-light/60 hover:text-luxury-gold transition-colors">
                                    Quitter
                                </button>
                            </div>
                        </nav>
                    </div>
                `;

                let mainContent = '';

                if (state.view === 'user') {
                    const filteredSongs = state.songs.filter(s => state.selectedTheme === 'Tous' || s.theme === state.selectedTheme);
                    const searchLower = (state.searchQuery || '').toLowerCase();
                    const themes = ['Tous', ...new Set(state.songs.map(s => s.theme))];
                    const votesLeft = Math.max(0, MAX_TOTAL_VOTES - state.totalUserVotes);
                    const isClosed = state.currentPhase === 3;

                    if (isClosed) {
                        const top40Songs = [...state.songs].filter(s => (s.votes || 0) > 0).sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 40);
                        mainContent = `
                            <div class="pb-24 pt-32 max-w-7xl mx-auto px-6 w-full animate-fade-in">
                                <div class="text-center mb-16">
                                    <h2 class="text-3xl font-serif text-luxury-light uppercase tracking-[0.2em] mb-4">L'Édition Définitive</h2>
                                    <div class="divider w-24 mx-auto"></div>
                                </div>
                                <div class="glass-panel p-6 rounded-sm">
                                    ${top40Songs.length > 0 ? `
                                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            ${top40Songs.map((song, i) => `
                                                <div class="flex items-center border-b border-luxury-border py-4 px-2 hover:bg-white/[0.02] transition-colors">
                                                    <div class="w-8 text-lg font-light ${i < 3 ? 'text-luxury-gold' : 'text-luxury-light/50'}">${String(i + 1).padStart(2, '0')}</div>
                                                    <div class="flex-1 px-4">
                                                        <div class="text-sm font-medium tracking-wide text-luxury-light">${song.title}</div>
                                                        <div class="text-xs font-light text-luxury-light/50 uppercase tracking-widest mt-1">${song.artist}</div>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : `<div class="text-center py-20 text-luxury-light/50 font-light uppercase tracking-widest">Le silence est d'or.</div>`}
                                </div>
                            </div>
                        `;
                    } else {
                        mainContent = `
                            <div class="pb-24 pt-28 max-w-7xl mx-auto px-6 w-full relative z-10">
                                
                                <!-- Contrôles Fixes (Sticky) -->
                                <div class="sticky top-16 z-40 bg-luxury-dark/95 backdrop-blur-md py-6 mb-8 border-b border-luxury-border -mx-6 px-6 sm:mx-0 sm:px-0">
                                    <div class="flex flex-col md:flex-row gap-6 justify-between items-end md:items-center">
                                        <div class="w-full md:w-1/3">
                                            <input id="searchInput" type="text" placeholder="Rechercher une œuvre..." 
                                                value="${(state.searchQuery || '').replace(/"/g, '&quot;')}" oninput="handleSearch(event)"
                                                class="w-full input-minimal py-2 text-sm text-luxury-light tracking-wide placeholder:text-luxury-light/30">
                                        </div>
                                        <div class="flex items-center gap-4 text-xs uppercase tracking-[0.2em] font-medium shrink-0">
                                            <span class="text-luxury-light/50">Sélection :</span>
                                            <span class="${votesLeft === 0 ? 'text-luxury-gold' : 'text-luxury-light'}">${votesLeft} / ${MAX_TOTAL_VOTES}</span>
                                        </div>
                                    </div>
                                    
                                    <div id="theme-scroll-container" class="flex overflow-x-auto gap-4 no-scrollbar pt-6 pb-2">
                                        ${themes.map(t => `
                                            <button onclick="setTheme('${t.replace(/'/g, "\\'")}')" class="whitespace-nowrap pb-2 text-xs uppercase tracking-[0.15em] transition-colors border-b-2 ${state.selectedTheme === t ? 'border-luxury-gold text-luxury-gold' : 'border-transparent text-luxury-light/40 hover:text-luxury-light'}">
                                                ${t}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                    ${filteredSongs.map(song => {
                                        const votes = state.userVotes[song.id] || 0;
                                        const isMax = votes >= MAX_VOTES_PER_SONG || state.totalUserVotes >= MAX_TOTAL_VOTES;
                                        const display = (song.title.toLowerCase().includes(searchLower) || song.artist.toLowerCase().includes(searchLower)) ? 'flex' : 'none';
                                        
                                        let btnClass = isMax ? "text-luxury-light/20 border-luxury-border cursor-not-allowed" : "text-luxury-gold border-luxury-gold hover:bg-luxury-gold hover:text-black";
                                        let btnText = votes > 0 ? (votes >= MAX_VOTES_PER_SONG ? "Atteint" : "Ajouté") : "Choisir";

                                        return `
                                            <div class="song-item-card luxury-card p-5 flex items-center justify-between" style="display: ${display};" data-search="${(song.title + ' ' + song.artist).toLowerCase().replace(/"/g, '&quot;')}">
                                                <div class="flex-1 pr-4 min-w-0">
                                                    <h3 class="font-medium text-sm md:text-base text-luxury-light tracking-wide truncate">${song.title}</h3>
                                                    <p class="text-xs font-light text-luxury-light/60 tracking-widest uppercase mt-1 truncate">${song.artist}</p>
                                                </div>
                                                <button onclick="vote(${song.id})" ${isMax ? 'disabled' : ''} class="shrink-0 border px-4 py-2 text-[10px] uppercase tracking-[0.2em] transition-all ${btnClass}">
                                                    ${btnText}
                                                </button>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                                <div id="empty-search-msg" class="text-center py-24 text-luxury-light/40 uppercase tracking-[0.2em] text-sm" style="display: ${filteredSongs.some(s => (s.title + ' ' + s.artist).toLowerCase().includes(searchLower)) ? 'none' : 'block'};">
                                    Aucune œuvre correspondante.
                                </div>
                            </div>
                        `;
                    }
                } 
                else if (state.view === 'admin') {
                    const ranked = [...state.songs].sort((a, b) => (b.votes || 0) - (a.votes || 0));
                    const totalVotes = state.songs.reduce((acc, song) => acc + (song.votes || 0), 0);

                    mainContent = `
                        <div class="pb-24 pt-32 max-w-5xl mx-auto px-6 w-full relative z-10">
                            <div class="flex flex-col md:flex-row justify-between items-end border-b border-luxury-border pb-6 mb-12">
                                <div>
                                    <h2 class="text-4xl font-serif font-light uppercase tracking-[0.1em] text-luxury-light">Tableau de Bord</h2>
                                    <div class="text-sm font-light text-luxury-light/50 tracking-widest mt-2 uppercase">Direction Artistique</div>
                                </div>
                                <div class="mt-4 md:mt-0 px-4 py-2 border border-luxury-border flex items-center gap-3">
                                    <div class="w-1.5 h-1.5 rounded-full ${isCloudActive ? (userId ? 'bg-luxury-gold' : 'bg-red-500') : 'bg-amber-600'}"></div>
                                    <span class="text-[10px] uppercase tracking-[0.2em] text-luxury-light/70">
                                        ${isCloudActive ? (userId ? 'Synchronisé' : 'Erreur Auth') : 'Hors Ligne'}
                                    </span>
                                </div>
                            </div>

                            <div class="glass-panel p-8 md:p-12 mb-12 relative">
                                <h3 class="text-xl font-serif uppercase tracking-[0.2em] text-luxury-gold mb-6">Orchestration</h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                                    <div class="border border-luxury-border p-6">
                                        <div class="text-xs uppercase tracking-widest text-luxury-light/50 mb-4">Statut de la session</div>
                                        <div class="font-serif text-2xl text-luxury-light mb-6">
                                            ${state.currentPhase === 0 ? 'En attente' :
                                              state.currentPhase === 1 ? 'Phase 1 : Invitation (QR)' :
                                              state.currentPhase === 2 ? 'Phase 2 : Sélection' : 'Clôturé'}
                                        </div>
                                        <div class="flex flex-col gap-3">
                                            ${state.currentPhase === 0 ? `
                                                <button onclick="startEventTimer('3H')" class="btn-outline py-3 text-xs">Standard (3H)</button>
                                                <button onclick="startEventTimer('1H')" class="btn-outline py-3 text-xs">Rapide (1H)</button>
                                            ` : `<button onclick="stopEventTimer()" class="btn-outline py-3 text-xs !text-red-400 !border-red-400/50 hover:!bg-red-400/10">Interrompre</button>`}
                                        </div>
                                    </div>
                                    
                                    <div class="border border-luxury-border p-6 flex flex-col justify-between">
                                        <div>
                                            <div class="text-xs uppercase tracking-widest text-luxury-light/50 mb-4">Contrôle Affichage</div>
                                            <div class="flex gap-4 mb-6">
                                                <button onclick="openExternalDisplay('qrcode')" class="flex-1 btn-outline py-3 text-[10px]">Projeter QR</button>
                                                <button onclick="openExternalDisplay('monitor')" class="flex-1 btn-outline py-3 text-[10px]">Projeter Top</button>
                                            </div>
                                        </div>
                                        <div class="flex gap-4">
                                            <button onclick="forceEndAndShowMonitor()" class="flex-1 btn-luxury py-3 text-[10px]">Finaliser</button>
                                            <button onclick="downloadM3U()" class="btn-outline px-4 flex items-center justify-center"><i class="ph-light ph-download-simple text-lg"></i></button>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="border-t border-luxury-border pt-8 grid grid-cols-1 md:grid-cols-3 gap-8">
                                    <div class="md:col-span-2 flex items-end gap-4">
                                        <div class="flex-1">
                                            <label class="text-[10px] uppercase tracking-widest text-luxury-light/50 block mb-2">Code d'accès</label>
                                            <input id="newGuestCode" type="text" value="${state.guestCode}" class="input-minimal w-full py-2 text-xl font-serif text-luxury-gold tracking-[0.2em] uppercase">
                                        </div>
                                        <button onclick="updateGuestCode()" class="btn-outline px-6 py-2 text-[10px]">Valider</button>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-[10px] uppercase tracking-widest text-luxury-light/50 mb-1">Suffrages</div>
                                        <div class="text-4xl font-serif text-luxury-gold">${totalVotes}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center justify-between mb-6">
                                <h3 class="text-lg font-serif uppercase tracking-[0.2em] text-luxury-light">Classement Interne</h3>
                                <div class="flex gap-4">
                                    <button onclick="allowReVote()" class="text-[10px] uppercase tracking-widest text-luxury-gold hover:text-luxury-light transition-colors">Renouveler</button>
                                    <button onclick="resetVotes()" class="text-[10px] uppercase tracking-widest text-red-400 hover:text-red-300 transition-colors">Purger</button>
                                </div>
                            </div>

                            <div class="glass-panel p-6">
                                ${ranked.filter(s => s.votes > 0).map((song, i) => `
                                    <div class="flex items-center border-b border-luxury-border last:border-0 py-4 px-2">
                                        <div class="w-8 text-sm font-light text-luxury-light/40">${String(i+1).padStart(2, '0')}</div>
                                        <div class="flex-1 px-4">
                                            <div class="text-sm font-medium tracking-wide text-luxury-light">${song.title}</div>
                                            <div class="text-[10px] font-light text-luxury-light/50 uppercase tracking-widest mt-1">${song.artist}</div>
                                        </div>
                                        <div class="text-lg font-light text-luxury-gold">${song.votes}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                htmlToRender = headerHTML + mainContent;
            }

            // --- POP-UP MODAL (REMASTERISÉ LUXE) ---
            let modalHTML = '';
            if (state.modal) {
                modalHTML = `
                    <div class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/90 backdrop-blur-md animate-fade-in">
                        <div class="border border-luxury-gold/30 bg-luxury-dark p-10 md:p-14 rounded-sm w-full max-w-lg text-center relative overflow-hidden">
                            <div class="noise-overlay" style="opacity: 0.05;"></div>
                            <h3 class="text-2xl font-serif text-luxury-light mb-6 uppercase tracking-[0.1em] relative z-10">${state.modal.title}</h3>
                            <p class="text-luxury-light/70 font-light mb-10 text-sm tracking-wide leading-relaxed relative z-10">${state.modal.message}</p>
                            <div class="flex gap-4 justify-center relative z-10">
                                ${state.modal.type === 'goodbye' ? `
                                    <i class="ph-thin ph-circle-notch animate-spin text-3xl text-luxury-gold"></i>
                                ` : state.modal.type === 'confirm' ? `
                                    <button onclick="window.closeModal()" class="flex-1 btn-outline py-3 text-[10px]">Décliner</button>
                                    <button onclick="window.confirmModal()" class="flex-1 btn-luxury py-3 text-[10px]">Approuver</button>
                                ` : `
                                    <button onclick="window.closeModal()" class="w-full sm:w-2/3 btn-luxury py-3 text-[10px]">Fermer</button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }

            root.innerHTML = htmlToRender + modalHTML;

            if (state.view === 'user' && state.themeScrollPos !== undefined) {
                const container = document.getElementById('theme-scroll-container');
                if (container) container.scrollLeft = state.themeScrollPos;
            }
        }

        render();
    </script>
</body>
</html>
