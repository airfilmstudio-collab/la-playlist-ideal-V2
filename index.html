<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050212">
    <title>La Playlist Idéale - Universal DJ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Styles Tailwind précompilés (tailwind.css) : plus de calcul des styles sur le téléphone.
         À régénérer après ajout de nouvelles classes : npx tailwindcss@3.4.16 -c tailwind.config.js -o tailwind.css --minify -->
    <link rel="stylesheet" href="tailwind.css?v=3.10.0">

    <!-- Icônes Phosphor (version figée) -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1" defer></script>

    <link rel="stylesheet" href="app.css?v=3.9.0">
</head>
<body class="text-slate-100 font-sans selection:bg-magical-pink/50 min-h-screen relative overflow-x-hidden">

    <!-- Fond holographique animé -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden bg-[#050212]" aria-hidden="true">
        <div class="orb orb-pink"></div><div class="orb orb-cyan"></div>
        <div class="orb orb-purple"></div><div class="orb orb-gold"></div>
    </div>

    <!-- L'application est entièrement rendue dans ce conteneur par app.js -->
    <div id="root" class="relative z-10 min-h-screen flex flex-col"></div>

    <script type="module" src="app.js?v=3.10.0"></script>
</body>
</html>
